        const info=stuckInfo(v);
        return `<div class="v-row" data-vid="${v.id}" style="margin-top:10px;border-color:#7f1d1d">
          <div style="min-width:0;flex:1">
            <div class="v-name">${v.year||''} ${v.make||''} ${v.model||''} <span style="color:#9aa3b8;font-weight:400;font-size:12px">#${v.stockNumber||'—'}</span></div>
            <div style="font-size:11px;color:#f87171;margin-top:3px">${info.reasons.join(' · ')}</div>
          </div>
          <div class="v-cost" style="color:#fca5a5">${daysInStage(v)}d</div>
          <svg class="v-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>`;
      }).join('')}
      ${!ST._stuckOpen && stuckVs.length>3?`<div style="font-size:11px;color:#7f1d1d;text-align:center;margin-top:8px">+ ${stuckVs.length-3} more — tap header to expand</div>`:''}
    </div>`;
  }

  // ══════════════════════════════════════════
  // 1. STATS PANEL — Today / Week / Month / YTD / All Time
  // ══════════════════════════════════════════
  const STAT_PERIODS=[

    {id:'week',  label:'Week'},
    {id:'month', label:'Month'},

        onclick="ST.dashPeriod='${p.id}';renderDashboard(document.getElementById('content'))">${p.label}</button>`).join('')}

    <div style="padding:12px 14px">

  // ══════════════════════════════════════════
  // 2. MINI TABS — Sale Pending / Sold / Appointment

  html+=`<div class="dash-tab-bar">`;

    const isActive=ST.dashTab===tab.id;
    html+=`<div class="dash-tab${isActive?' active':''}" style="--tab-color:${tab.color}" onclick="ST.dashTab='${tab.id}';renderDashboard(document.getElementById('content'))">

  // Active tab vehicle list

    html+=`<div style="background:${activeTabDef.color}0d;border:1px solid ${activeTabDef.color}33;border-radius:12px;padding:12px;margin-bottom:14px">`;

      html+=`<div style="font-size:12px;font-weight:600;color:${activeTabDef.color};margin-bottom:10px">${activeTabDef.icon} ${activeTabDef.label} (${activeTabDef.vehicles.length})</div>`;

    activeTabDef.vehicles.forEach(v=>{html+=vRowHTML(v);});

    html+=`<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;padding:20px;text-align:center;margin-bottom:14px;color:#7a8499;font-size:13px">No ${activeTabDef.label.toLowerCase()} vehicles</div>`;
  }

  // ══════════════════════════════════════════
  // 3. MECHANIC STATUS
  // ══════════════════════════════════════════
  html+=`<div class="sec-hdr">MECHANIC STATUS</div>`;
  getMechs().forEach(m=>{
    const asgn=vs.filter(v=>v.assignedTo===m.id||v.assignedTo2===m.id);
    const hi=asgn.filter(v=>v.priority==='high').length;
    const activeSessionsAll=vs.flatMap(v2=>(v2.timeSessions||[]).filter(s=>s.mechId===m.id&&!s.end).map(s=>({...s,vehicle:v2})));
    const isActive=activeSessionsAll.length>0;
    const primaryVeh=isActive?activeSessionsAll[0].vehicle:null;
    const sessionStart=isActive?activeSessionsAll[0].start:null;
    const elapsed=isActive?Math.round((Date.now()-sessionStart)/60000):0;
    const eStr=elapsed>=60?Math.floor(elapsed/60)+'h '+elapsed%60+'m':elapsed+'m';
    html+=`<div style="background:#111318;border:1px solid ${isActive?m.color+'66':'#1e2230'};border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer" onclick="ST.role='${m.id}';ST.view='mypipeline';render()">
      <div style="display:flex;align-items:center;gap:11px">
        <div style="width:40px;height:40px;border-radius:50%;background:${m.color}22;border:2px solid ${isActive?m.color:'#2a2f3f'};display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;position:relative">
          ${m.icon}${isActive?`<span style="position:absolute;bottom:-2px;right:-2px;width:11px;height:11px;background:#4ade80;border-radius:50%;border:2px solid #111318"></span>`:''}
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
            <span style="font-size:14px;font-weight:600;color:#fff">${m.name}</span>
            ${isActive?`<span style="font-size:10px;font-weight:700;color:#4ade80;background:#0d2a0d;border:1px solid #166534;padding:2px 7px;border-radius:20px">● ACTIVE</span>`:`<span style="font-size:10px;color:#7a8499;background:#161921;padding:2px 7px;border-radius:20px">IDLE</span>`}
          </div>
          ${isActive?`<div style="font-size:12px;color:#cdd3de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Working on <span style="color:#fff;font-weight:500">${primaryVeh.year||''} ${primaryVeh.make||''} ${primaryVeh.model||''}</span>${primaryVeh.stockNumber?` · #${primaryVeh.stockNumber}`:''}</div>

            `<div style="font-size:12px;color:#7a8499">${asgn.length} car${asgn.length!==1?'s':''} assigned${hi?` · <span style="color:#f87171">${hi} high priority</span>`:''}</div>`}
        </div>
        ${isActive?`<div style="text-align:right;flex-shrink:0"><div style="font-size:18px;font-weight:700;color:${m.color}">${eStr}</div><div style="font-size:10px;color:#9aa3b8">on clock</div></div>`:''}
      </div>
    </div>`;
  });
  html+=`<div style="margin-bottom:14px"></div>`;

  // ══════════════════════════════════════════
  
  // ══════════════════════════════════════════
  // 4. VEHICLES BY STATUS (ordered groups)
  // ══════════════════════════════════════════
  const STATUS_ORDER = [
    {ids:['sale_pending','sold'], label:'Sold / Sale pending', icon:'💰', color:'#10b981'},
    {ids:['customer_appt'],       label:'Appointment',         icon:'📅', color:'#06b6d4'},

// 4. STATUS GROUPS (work / finish / lot / source)
  // ══════════════════════════════════════════
  ['work','finish','lot','source'].forEach(grp=>{

  c.querySelectorAll('.v-row').forEach(row=>{

// Dashboard drill-down: the vehicles acquired in the selected period, with the All Vehicles filter bar.
function renderAcquired(c){
  const period=ST.acqPeriod||ST.dashPeriod||'today';
  renderVehicles(c,{
    period,
    title:'Acquired · '+periodLabel(period),
    vehicles:acquiredInPeriod(period),
    back:()=>{ST.view='dashboard';render();},
    // the drill-down keeps its own filter state so All Vehicles is unaffected
    state:{include:'acqInclude',exclude:'acqExclude',mech:'acqMech',query:'acqQuery'}
  });
}

function renderVehicles(c,scope){
  const canAdd = ST.role === 'manager';
  const F = scope&&scope.state ? scope.state : {include:'vfInclude',exclude:'vfExclude',mech:'vfMech',query:'searchQuery'};
  if(!ST[F.include]) ST[F.include]=[];
  if(!ST[F.exclude]) ST[F.exclude]=[];
  if(ST[F.query]==null) ST[F.query]='';
  const rerender=()=>scope?renderVehicles(c,scope):renderVehicles(c);
  if(scope){
    setTopbar(scope.title, `<button class="tb-back" id="acq-back">‹ Dashboard</button>`);
    document.getElementById('acq-back').onclick=scope.back;
  } else {
    setTopbar('All vehicles', canAdd ? `<button class="btn-red" onclick="ST.view='add';render()">+ Add</button>` : '');
  }

  const groups=[
    {label:'Sale',   statuses:ALL_STATUSES.filter(s=>s.group==='sale')},
    {label:'Source', statuses:ALL_STATUSES.filter(s=>s.group==='source')},
    {label:'Lot',    statuses:ALL_STATUSES.filter(s=>s.group==='lot')},
    {label:'Work',   statuses:ALL_STATUSES.filter(s=>s.group==='work')},
    {label:'Finish', statuses:ALL_STATUSES.filter(s=>s.group==='finish')},
  ];

  const mechOptions=getMechs().map(m=>`<option value="${m.id}">${m.icon} ${m.name}</option>`).join('');

  function chipState(sid){
    if(ST[F.include].includes(sid)) return 'in';
    if(ST[F.exclude].includes(sid)) return 'ex';
    return 'off';
  }

  let html='';
  if(scope){
    const periods=[['today','Today'],['week','Week'],['month','Month'],['year','YTD'],['all','All time']];
    html+=`<div class="acq-bar">${periods.map(([id,l])=>`<button class="stats-period-btn${scope.period===id?' active':''}" data-period="${id}">${l}</button>`).join('')}</div>
    <div class="acq-note">${scope.vehicles.length} vehicle${scope.vehicles.length!==1?'s':''} acquired ${periodLabel(scope.period).toLowerCase()} · filters below apply within this group</div>`;
  }
  html+=`
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="#555d73" stroke-width="1.4"/><line x1="10" y1="10" x2="13" y2="13" stroke="#555d73" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="vs-search" value="${ST[F.query]}" placeholder="Search VIN, stock #, make, model, year...">
    <button class="search-clear" id="vs-clear">✕</button>
  </div>
  <div style="font-size:10px;color:#7a8499;margin-bottom:5px;font-weight:600;letter-spacing:.5px">TAP = INCLUDE &nbsp;·&nbsp; TAP AGAIN = EXCLUDE &nbsp;·&nbsp; TAP AGAIN = CLEAR</div>
  <div class="sf-bar" id="sf-status-chips">
    ${groups.map(g=>g.statuses.map(s=>{
      const st=chipState(s.id);
      const cls=st==='in'?'sf-chip on':st==='ex'?'sf-chip ex':'sf-chip';
      const sty=st==='in'?`background:${s.color}44;color:#fff;border-color:${s.color}`:st==='ex'?'':`background:${s.color}14;color:${s.color};border-color:${s.color}40`;
      const prefix=st==='ex'?'✕ ':'';
      return`<button class="${cls}" data-sid="${s.id}" style="${sty}">${prefix}${s.icon} ${s.label}</button>`;
    }).join('')).join('')}
  </div>
  <div style="display:flex;gap:7px;margin-bottom:10px">
    <select id="vf-mech" style="flex:1;background:#111318;border:1px solid #2a2f3f;border-radius:8px;padding:8px 10px;color:${ST[F.mech]?'#fff':'#555d73'};font-size:12px;font-weight:600">
      <option value="">All mechanics</option>
      <option value="__none__">— Not assigned</option>
      ${mechOptions}
    </select>
  </div>`;

  // ── Apply filters ──
  const q=ST[F.query].trim().toLowerCase();
  let filtered=scope&&scope.vehicles?scope.vehicles:ST.vehicles;

  if(q) filtered=filtered.filter(v=>
    (v.vin||'').toLowerCase().includes(q)||(v.vin||'').slice(-6).toLowerCase().includes(q)||
    (v.stockNumber||'').toLowerCase().includes(q)||(v.make||'').toLowerCase().includes(q)||
    (v.model||'').toLowerCase().includes(q)||(v.year||'').toString().includes(q)
  );
  // Include filter: vehicle must have ALL included statuses
  if(ST[F.include].length) filtered=filtered.filter(v=>
    ST[F.include].every(sid=>(v.statuses||[]).includes(sid))
  );
  // Exclude filter: vehicle must have NONE of the excluded statuses
  if(ST[F.exclude].length) filtered=filtered.filter(v=>
    ST[F.exclude].every(sid=>!(v.statuses||[]).includes(sid))
  );
  if(ST[F.mech]==='__none__') filtered=filtered.filter(v=>!v.assignedTo);
  else if(ST[F.mech]) filtered=filtered.filter(v=>v.assignedTo===ST[F.mech]||v.assignedTo2===ST[F.mech]);

  const sorted=[...filtered].sort((a,b)=>b.updatedAt-a.updatedAt);

  // Active filter summary
  const inclLabels=ST[F.include].map(sid=>SMAP[sid]).filter(Boolean).map(s=>`${s.icon} ${s.label}`);
  const exclLabels=ST[F.exclude].map(sid=>SMAP[sid]).filter(Boolean).map(s=>`✕ ${s.label}`);
  const mechLabel=ST[F.mech]==='__none__'?'Not assigned':(ST[F.mech]?getMMAP()[ST[F.mech]]?.name:'');
  const anyActive=ST[F.include].length||ST[F.exclude].length||ST[F.mech];

  html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="font-size:12px;color:#9aa3b8;flex:1;min-width:0">
      <span>${sorted.length} vehicle${sorted.length!==1?'s':''}</span>
      ${inclLabels.length?`<span style="color:#C8102E"> · ${inclLabels.join(' + ')}</span>`:''}
      ${exclLabels.length?`<span style="color:#f87171"> · ${exclLabels.join(', ')}</span>`:''}
      ${mechLabel?`<span style="color:#C8102E"> · ${mechLabel}</span>`:''}
    </div>
    ${anyActive?`<button id="vf-clear-all" style="background:none;border:none;color:#7a8499;font-size:11px;cursor:pointer;padding:2px 8px;white-space:nowrap;flex-shrink:0">Clear all</button>`:''}
  </div>`;

  html+=`<div class="v-list">`;
  sorted.forEach(v=>{ html+=vRowHTML(v); });
  html+=`</div>`;
  if(!sorted.length) html+=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-msg">No vehicles match</div><div class="empty-sub">Try adjusting filters</div></div>`;

  c.innerHTML=html;

  // Wire chips: off→in→ex→off cycle
  c.querySelectorAll('#sf-status-chips .sf-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sid=btn.dataset.sid;
      const inI=ST[F.include].indexOf(sid);
      const exI=ST[F.exclude].indexOf(sid);
      if(inI>=0){
        // was included → move to excluded
        ST[F.include].splice(inI,1);
        ST[F.exclude].push(sid);
      } else if(exI>=0){
        // was excluded → clear
        ST[F.exclude].splice(exI,1);
      } else {
        // was off → include
        ST[F.include].push(sid);
      }
      rerender();
    });
  });

  const mSel=c.querySelector('#vf-mech');
  if(mSel){ mSel.value=ST[F.mech]||''; mSel.onchange=()=>{ST[F.mech]=mSel.value;rerender();}; }

  const clearAll=c.querySelector('#vf-clear-all');
  if(clearAll) clearAll.onclick=()=>{ST[F.include]=[];ST[F.exclude]=[];ST[F.mech]='';ST[F.query]='';rerender();};

  const si=c.querySelector('#vs-search');
  if(si){
    si.oninput=e=>{
      ST[F.query]=e.target.value;
      const cursorPos=si.selectionStart;
      rerender();
      // Restore focus and cursor position after re-render
      const newSi=c.querySelector('#vs-search');
      if(newSi){
        newSi.focus();
        try{newSi.setSelectionRange(cursorPos,cursorPos);}catch(e){}
      }
    };
  }

  const sc=c.querySelector('#vs-clear');
  if(sc) sc.onclick=()=>{ST[F.query]='';ST[F.include]=[];ST[F.exclude]=[];ST[F.mech]='';rerender();};

  c.querySelectorAll('.v-row').forEach(row=>{
    row.onclick=()=>{ST.selectedId=row.dataset.vid;ST.view='detail';ST.activeTab='overview';render();};
  });
  c.querySelectorAll('.acq-bar [data-period]').forEach(b=>b.onclick=()=>{ST.acqPeriod=b.dataset.period;ST.dashPeriod=b.dataset.period;render();});
}

// ─── WORKFLOW AGING / STUCK DETECTION ───
// stageStart: when the vehicle's statuses last changed (fallback: updatedAt/createdAt)
function stageStartOf(v){ return v.statusChangedAt || v.updatedAt || v.createdAt || Date.now(); }
function daysInStage(v){ return Math.floor((Date.now() - stageStartOf(v)) / 86400000); }
// A vehicle is "stuck" when it's active (not booked/sold-and-done) and hasn't
// moved stages in 7+ days, or has a concern pending approval for 3+ days.
function stuckInfo(v){
  const sts=v.statuses||[];
  if(sts.includes('booked')) return {stuck:false};
  const reasons=[];
  const d=daysInStage(v);
  if(d>=7) reasons.push(`no status change ${d}d`);
  const oldPending=(v.concerns||[]).filter(c=>c.status==='pending' && (Date.now()-(c.createdAt||0))>=3*86400000);
  if(oldPending.length) reasons.push(`${oldPending.length} concern${oldPending.length!==1?'s':''} pending 3d+`);
  const lateParts=(v.parts||[]).filter(p=>(p.state||'received')==='ordered' && p.eta && new Date(p.eta).getTime()<Date.now());
  if(lateParts.length) reasons.push(`${lateParts.length} part${lateParts.length!==1?'s':''} past ETA`);
  return {stuck:reasons.length>0, days:d, reasons};
}

function vRowHTML(v){
  const sts=(v.statuses||[]).map(id=>SMAP[id]).filter(Boolean);
  const _vp=(v.parts||[]).reduce((a,p)=>a+((parseFloat(p.cost)||0)*(parseInt(p.qty)||1)),0);
  const _vl=(v.laborLines||[]).reduce((a,l)=>a+((parseFloat(l.hours)||0)*(parseFloat(l.rate)||0)),0);
  const _vr=(v.repairs||[]).reduce((a,r)=>a+Number(r.cost||0),0);
  const cost=_vp+_vl+_vr;
  const mech=v.assignedTo?getMMAP()[v.assignedTo]:null;
  const mech2=v.assignedTo2?getMMAP()[v.assignedTo2]:null;
  const _stg=daysInStage(v);
  const _stuck=stuckInfo(v);
  const pri=v.priority?PMAP[v.priority]:null;
  const photo=photoUrl(v.photos&&v.photos[0]);
  const isSalePending=(v.statuses||[]).includes('sale_pending');
  const isSold=(v.statuses||[]).includes('sold');
  const borderColor=isSalePending?'#f59e0b55':isSold?'#10b98133':'#1e2230';
  const concerns=v.concerns||[];
  const pendingC=concerns.filter(c=>c.status==='pending').length;
  // Parts pipeline counts
  const partsPending = (v.parts||[]).filter(p=>{
    const s = p.state || 'received';
    return s === 'needed' || s === 'ordered';
  });
  const orderedCount = partsPending.filter(p=>(p.state||'received')==='ordered').length;
  const neededCount = partsPending.filter(p=>(p.state||'received')==='needed').length;
  // Use a single chip showing both counts; clicking jumps to repairs tab
  let partsBadge = '';
  if(partsPending.length){
    // Find soonest ETA among ordered parts
    const etas = partsPending.filter(p=>p.state==='ordered' && p.eta).map(p=>p.eta).sort();
    let etaSuffix = '';
    if(etas.length){
      const days = Math.ceil((etas[0] - Date.now()) / 86400000);
      if(days < 0) etaSuffix = ` · ⚠ late`;
      else if(days === 0) etaSuffix = ` · today`;
      else if(days === 1) etaSuffix = ` · tmrw`;
      else if(days <= 7) etaSuffix = ` · ${days}d`;
    }
    partsBadge = `<span class="v-tag" style="background:#1e3a8a22;color:#bfdbfe;border-color:#1e3a8a55">🚚 ${partsPending.length} part${partsPending.length!==1?'s':''} pending${etaSuffix}</span>`;
  }
  return`<div class="v-row" data-vid="${v.id}" style="border-color:${borderColor}${isSalePending?';background:#1a120044':''}">
    ${photo?`<div class="v-row-photo"><img src="${photo}" loading="lazy"></div>`:`<div class="v-row-photo-empty"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2 10L4 5h8l2 5H2z" stroke="#374151" stroke-width="1.2" fill="none"/></svg></div>`}
    <div style="min-width:0">
      <div class="v-name">${v.year||''} ${v.make||''} ${v.model||''}</div>
      <div class="v-meta">#${v.stockNumber||'—'} · ...${(v.vin||'------').slice(-6)}${mech?` · ${mech.icon} ${mech.name}`:''}${mech2?` <span style="color:#9aa3b8">+</span> ${mech2.icon} ${mech2.name}`:''}${_stg>=1?` · <span style="color:${_stg>=7?'#f87171':'#555d73'}">${_stg}d in stage</span>`:''}</div>
      ${v.apptDate?`<div style="font-size:11px;color:#06b6d4;font-weight:600;margin-top:4px;margin-bottom:2px">📅 ${new Date(v.apptDate).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`:''}
      <div class="v-tags">${sts.map(s=>{
        // For customer_appt: drop the calendar icon since the date row above already shows it
        const lbl = s.id==='customer_appt' ? s.label : `${s.icon} ${s.label}`;
        return `<span class="v-tag" style="background:${s.color}18;color:${s.color};border-color:${s.color}30">${lbl}</span>`;
      }).join('')}${pendingC?`<span class="v-tag" style="background:#C8102E22;color:#C8102E;border-color:#C8102E33">⚠️ ${pendingC} concern${pendingC!==1?'s':''}</span>`:''}${partsBadge}${_stuck.stuck?`<span class="v-tag" style="background:#7f1d1d44;color:#fca5a5;border-color:#ef444455">⏰ stuck</span>`:''}</div>
    </div>
    ${pri?`<div><div class="v-pri" style="background:${pri.color}18;color:${pri.color}">${pri.icon} ${pri.label}</div><div class="v-cost" style="margin-top:6px">${fmt$(cost)}</div></div>`:
          `<div class="v-cost">${fmt$(cost)}</div>`}
    <svg class="v-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/></svg>
  </div>`;
}

      model:inputs.model,
      color:inputs.color,

      source:inputs.source,
      statuses:inputs.statuses,
      assignedTo:inputs.assignedTo,

    // Ensure visits[] exists (migrate if needed)
    if(!Array.isArray(v.visits)||!v.visits.length){
      migrateVehiclesToVisits();

    // Create a fresh visit with the new stock # and status tags
    const visit={
      id: v.id + '-v' + ((v.visits||[]).length + 1),
      dateIn: Date.now(),
      dateOut: null,
      stockNumber: inputs.stock,
      statuses: inputs.statuses,
      assignedTo: inputs.assignedTo,
      priority: inputs.priority,
      apptDate: inputs.apptDate,
      parts: [], laborLines: [], repairs: [],
      receipts: [], photos: [], notes: inputs.notes,
      concerns: [], comments: [], timeSessions: []
    };
    v.visits = [...(v.visits||[]), visit];
    // Keep vehicle-level static info updated if new values are supplied

    save();
    toast(`New visit added to ${v.year} ${v.make} ${v.model}`);
    ST.selectedId=v.id;ST.view='detail';ST.activeTab='history';render();
  };
}

function makeTagBtn(label,active,color){
  const btn=document.createElement('button');
  btn.className='tag-btn'+(active?' on':'');
  btn.textContent=label;
  if(active)btn.style.cssText=`background:${color}22;color:${color};border-color:${color}55`;
  return btn;
}

// ═══════════════════════════════════════════════
// VIN-EXISTS MODAL — prevents duplicate overwrite
// When user enters a vehicle whose VIN is already on file, ask them:
//   - Add as a NEW VISIT to the existing record (preserves history), OR
//   - Create as a SEPARATE vehicle anyway (same VIN, different record)
//   - Cancel
// ═══════════════════════════════════════════════
function showVinExistsModal(existingVehicle, inputs){
  const v=existingVehicle;
  const visitCount=(v.visits||[]).length||1;
  const lastVisit=(v.visits||[]).slice(-1)[0];
  const lastStatuses=((lastVisit&&lastVisit.statuses)||v.statuses||[]).map(id=>SMAP[id]?.label||id).join(', ')||'—';
  const createdStr=v.createdAt?fmtD(v.createdAt):'—';

  // Remove any existing instance
  const existingModal=document.getElementById('vin-exists-modal');
  if(existingModal) existingModal.remove();

  const modal=document.createElement('div');
  modal.id='vin-exists-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;font-family:inherit';
  modal.innerHTML=`
    <div style="background:#0e1117;border:1px solid #1e2230;border-radius:14px;max-width:460px;width:100%;padding:22px;max-height:90vh;overflow-y:auto">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px">
        <div style="font-size:28px;line-height:1">⚠️</div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#fbbf24;margin-bottom:4px">This VIN is already on file</div>
          <div style="font-size:12px;color:#b8c3d3">${inputs.vin}</div>
        </div>
      </div>

      <div style="background:#131824;border:1px solid #243048;border-radius:10px;padding:12px;margin-bottom:16px">
        <div style="font-size:14px;font-weight:600;color:#e8eaf2;margin-bottom:6px">${v.year||''} ${v.make||''} ${v.model||''}</div>
        <div style="font-size:11px;color:#b8c3d3;line-height:1.6">
          Existing Stock&nbsp;#: <span style="color:#e8eaf2">${v.stockNumber||'—'}</span><br>
          ${visitCount} visit${visitCount!==1?'s':''} on file<br>
          Added: <span style="color:#e8eaf2">${createdStr}</span><br>
          Latest status: <span style="color:#e8eaf2">${lastStatuses}</span>
        </div>
      </div>

      <div style="font-size:12px;color:#b8c3d3;margin-bottom:14px;line-height:1.6">
        You're entering Stock #<span style="color:#e8eaf2">${inputs.stock}</span>. What would you like to do?
      </div>

      <button id="vin-add-visit" style="width:100%;background:#0b3d25;border:1px solid #10b98155;color:#6ee7b7;border-radius:9px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left">
        <div style="font-weight:700;margin-bottom:2px">➕ Add as new visit</div>
        <div style="font-size:11px;opacity:.8;font-weight:400">Attach to the existing record. Keeps all history, photos, receipts.</div>
      </button>

      <button id="vin-create-separate" style="width:100%;background:#0d0f14;border:1px solid #374151;color:#cdd3de;border-radius:9px;padding:13px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:8px;text-align:left">
        <div style="font-weight:700;margin-bottom:2px">📄 Create as separate record</div>
        <div style="font-size:11px;opacity:.8;font-weight:400">New standalone vehicle with the same VIN (title-swap, rebuild, etc.).</div>
      </button>

      <button id="vin-cancel" style="width:100%;background:transparent;border:1px solid #1e2230;color:#9aa3b8;border-radius:9px;padding:11px;font-size:12px;font-weight:500;cursor:pointer">
        Cancel
      </button>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelector('#vin-add-visit').onclick=()=>{
    modal.remove();
    addVisitToExistingVehicle(v.id, inputs);
  };
  modal.querySelector('#vin-create-separate').onclick=()=>{
    modal.remove();
    createNewVehicleFromInputs(inputs);
  };
  modal.querySelector('#vin-cancel').onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal) modal.remove();};
}
window.showVinExistsModal=showVinExistsModal;

// POPUP CALENDAR WIDGET
// ══════════════════════════════════════════════
function openCalendar(currentVal, onConfirm){
    // Remove any existing calendar
    document.querySelector('.cal-overlay')?.remove();

    // Parse existing value or default to now+1hr rounded to next :00
    let sel = currentVal ? new Date(currentVal) : new Date();
    if(isNaN(sel.getTime())) sel = new Date();
    let viewYear  = sel.getFullYear();
    let viewMonth = sel.getMonth();

    const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];

    const overlay = document.createElement('div');
    overlay.className = 'cal-overlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
    document.body.appendChild(overlay);

    function drawCal(){
      const today  = new Date();
      const selY=sel.getFullYear(), selM=sel.getMonth(), selD=sel.getDate();
      const hh=sel.getHours().toString().padStart(2,'0');
      const mm=sel.getMinutes().toString().padStart(2,'0');

      const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
      const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate();

      let dayBtns='';
      DOW.forEach(d=>{ dayBtns+=`<div class="cal-dow">${d}</div>`; });

      // Prev month filler
      for(let i=firstDay-1;i>=0;i--)
        dayBtns+=`<button class="cal-day other-month" disabled>${daysInPrev-i}</button>`;

      // Current month days
      for(let d=1;d<=daysInMonth;d++){
        const isToday = d===today.getDate()&&viewMonth===today.getMonth()&&viewYear===today.getFullYear();
        const isSel   = d===selD&&viewMonth===selM&&viewYear===selY;
        dayBtns+=`<button class="cal-day${isToday?' today':''}${isSel?' selected':''}" data-day="${d}">${d}</button>`;
      }

      // Next month filler
      const rem=(firstDay+daysInMonth)%7;
      for(let d=1;d<=(rem?7-rem:0);d++)
        dayBtns+=`<button class="cal-day other-month" disabled>${d}</button>`;

      const selLabel=`${MONTHS[selM]} ${selD}, ${selY} at ${hh}:${mm}`;

      overlay.innerHTML=`<div class="cal-box">
        <div class="cal-hdr">
          <button class="cal-nav" id="cal-prev">‹</button>
          <div class="cal-title">${MONTHS[viewMonth]} ${viewYear}</div>
          <button class="cal-nav" id="cal-next">›</button>
        </div>
        <div class="cal-grid" id="cal-grid-inner">${dayBtns}</div>
        <div class="cal-time">
          <div class="cal-time-label">🕐 Time</div>
          <input class="cal-time-input" type="time" id="cal-time-val" value="${hh}:${mm}" style="flex:1">
        </div>
        <div style="padding:6px 16px 4px;font-size:12px;color:#9aa3b8;text-align:center">
          Selected: <span style="color:#06b6d4;font-weight:600">${selLabel}</span>
        </div>
        <div class="cal-footer">
          <button class="cal-cancel" id="cal-cancel-btn">Cancel</button>
          <button class="cal-confirm" id="cal-confirm-btn">✓ Confirm</button>
        </div>
      </div>`;

      // Wire events with addEventListener (no inline onclick — avoids scope issues)
      overlay.querySelector('#cal-prev').addEventListener('click', e=>{
        e.stopPropagation();
        viewMonth--;
        if(viewMonth<0){viewMonth=11;viewYear--;}
        drawCal();
      });
      overlay.querySelector('#cal-next').addEventListener('click', e=>{
        e.stopPropagation();
        viewMonth++;
        if(viewMonth>11){viewMonth=0;viewYear++;}
        drawCal();
      });
      overlay.querySelector('#cal-time-val').addEventListener('change', e=>{
        const [h,m]=(e.target.value||'00:00').split(':').map(Number);
        sel.setHours(h||0, m||0, 0, 0);
        drawCal();
      });
      overlay.querySelectorAll('.cal-day[data-day]').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.stopPropagation();
          sel.setFullYear(viewYear, viewMonth, parseInt(btn.dataset.day));
          drawCal();
        });
      });
      overlay.querySelector('#cal-cancel-btn').addEventListener('click', e=>{
        e.stopPropagation();
        overlay.remove();
      });
      overlay.querySelector('#cal-confirm-btn').addEventListener('click', e=>{
        e.stopPropagation();
        const pad=n=>n.toString().padStart(2,'0');
        const iso=`${sel.getFullYear()}-${pad(sel.getMonth()+1)}-${pad(sel.getDate())}T${pad(sel.getHours())}:${pad(sel.getMinutes())}`;
        overlay.remove();
        onConfirm(iso);
      });
    }

    drawCal();
  }

  // ── Claude Vision: reads printed VIN text directly off the sticker photo ──
  async function readVinWithAI(imgB64){
    try{
      const match=imgB64.match(/^data:([^;]+);base64,(.+)$/);
      if(!match){console.error('readVinWithAI: invalid data URL');return null;}
      const mimeType=match[1];
      const b64data=match[2];
      console.log('[VIN] Calling proxy',AI_PROXY,'with',Math.round(b64data.length/1024),'KB',mimeType);

      const resp=await fetch(AI_PROXY+'/vin',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({imageData:b64data,mediaType:mimeType})
      });
      console.log('[VIN] Response status:',resp.status);
      const text=await resp.text();
      console.log('[VIN] Response body:',text);
      if(!resp.ok){console.error('[VIN] Proxy error',resp.status,text);return null;}
      const data=JSON.parse(text);
      if(data.error){console.error('[VIN] Worker error:',data.error);return null;}
      const raw=(data.vin||'').trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
      console.log('[VIN] Extracted:',raw,'len:',raw.length);
      return raw.length===17?raw:null;
    }catch(e){console.error('[VIN] readVinWithAI exception:',e);return null;}
  }




  // ── HELPERS ────────────────────────────────────

  function setBadge(html){

  function extractVin(raw){
    const s=(raw||'').trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
    if(s.length===17) return s;
    const m=s.match(/[A-HJ-NPR-Z0-9]{17}/);
    return m?m[0]:null;
  }

  function loadImg(src){
    return new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>res(img);
      img.onerror=rej;
      img.src=src;
    });
  }

  // Invert + crop bottom half — accepts base64, returns base64
  function invertImageB64(b64){
    return new Promise(resolve=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const sc=Math.min(1,1600/img.naturalWidth);
          const cw=Math.round(img.naturalWidth*sc);
          const ch=Math.round(img.naturalHeight*sc);
          const c=document.createElement('canvas');c.width=cw;c.height=ch;
          const ctx=c.getContext('2d');ctx.drawImage(img,0,0,cw,ch);
          const bY=Math.round(ch*0.48);const bH=ch-bY;
          const c2=document.createElement('canvas');c2.width=cw;c2.height=bH;
          const ctx2=c2.getContext('2d');
          ctx2.drawImage(c,0,bY,cw,bH,0,0,cw,bH);
          const id=ctx2.getImageData(0,0,cw,bH);
          for(let i=0;i<id.data.length;i+=4){
            id.data[i]=255-id.data[i];
            id.data[i+1]=255-id.data[i+1];
            id.data[i+2]=255-id.data[i+2];
          }
          ctx2.putImageData(id,0,0);
          resolve(c2.toDataURL('image/png'));
        }catch(e){resolve(b64);}
      };
      img.onerror=()=>resolve(b64);
      img.src=b64;
    });
  }

  // Canvas barcode strip reader — accepts base64, returns VIN or null
  function canvasBarcodeRead(b64){
    return new Promise(resolve=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const W=800;
          const H=Math.round(img.naturalHeight*(W/img.naturalWidth));
          const c=document.createElement('canvas');c.width=W;c.height=H;
          const ctx=c.getContext('2d');ctx.drawImage(img,0,0,W,H);
          const results=[];
          const startY=Math.round(H*0.4);
          for(let pass=0;pass<2;pass++){
            for(let row=startY;row<H-5;row+=4){
              const pixels=ctx.getImageData(0,row,W,1).data;
              let transitions=0,prevLum=-1;
              for(let x=0;x<W;x++){
                const i=x*4;
                let lum=pixels[i]*0.299+pixels[i+1]*0.587+pixels[i+2]*0.114;
                if(pass===1)lum=255-lum;
                const bit=lum>128?1:0;
                if(prevLum!==-1&&bit!==prevLum)transitions++;
                prevLum=bit;
              }
              if(transitions>50&&transitions<400){
                const rc=document.createElement('canvas');rc.width=W;rc.height=44;
                const rCtx=rc.getContext('2d');
                rCtx.drawImage(c,0,Math.max(0,row-20),W,40,0,0,W,40);
                if(pass===1){
                  const rd=rCtx.getImageData(0,0,W,44);
                  for(let i=0;i<rd.data.length;i+=4){rd.data[i]=255-rd.data[i];rd.data[i+1]=255-rd.data[i+1];rd.data[i+2]=255-rd.data[i+2];}
                  rCtx.putImageData(rd,0,0);
                }
                results.push(rc.toDataURL('image/png'));
              }
            }
          }
          if(!results.length||!('BarcodeDetector' in window)){resolve(null);return;}
          const det=new window.BarcodeDetector({formats:['code_39','code_128']});
          const strips=results.slice(0,10);
          let idx=0,found=null;
          function next(){
            if(idx>=strips.length||found){resolve(found);return;}
            loadImg(strips[idx++]).then(imgEl=>{
              createImageBitmap(imgEl).then(bmp=>{
                det.detect(bmp).then(codes=>{
                  for(const code of codes){const v=extractVin(code.rawValue||'');if(v){found=v;resolve(v);return;}}
                  next();
                }).catch(next);
              }).catch(next);
            }).catch(next);
          }
          next();
        }catch(e){resolve(null);}
      };
      img.onerror=()=>resolve(null);
      img.src=b64;
    });
  }

  function scanLoop(){
    if(!scanActive)return;
    const video=document.getElementById('vm-video');
    if(!video||video.readyState<2){scanRaf=requestAnimationFrame(scanLoop);return}

    if('BarcodeDetector' in window){
      const detector=new window.BarcodeDetector({formats:['code_39','code_128','pdf417','data_matrix','qr_code','ean_13','ean_8','upc_a']});
      const canvas=document.createElement('canvas');
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(video,0,0);
      detector.detect(canvas).then(codes=>{
        if(!scanActive)return;
        for(const code of codes){
          const raw=code.rawValue.trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
          if(raw.length===17){
            showDetected(raw);return;
          }
          // Try extracting 17-char sequence from longer strings (VIN plate text)
          const match=raw.match(/[A-HJ-NPR-Z0-9]{17}/);

  // ══════════════════════════════════════════════
  // RECEIPT SCANNER (AI)
  // ══════════════════════════════════════════════
  // Extract auto parts from a receipt (image OR PDF) via the Worker.
  // Returns: {items: [...], tax: number, documentType: 'image'|'pdf'} or null on error
  // Tax + shipping on a receipt are part of what the parts cost: spread over the items in proportion to price.
  function foldReceiptExtras(items, extras){
    extras = Number(extras)||0;
    const sub = items.reduce((a,it)=>a + (Number(it.eachCost)||0)*(Number(it.quantity)||1), 0);
    if(!(extras>0) || !(sub>0)) return items;
    return items.map(it=>{
      const qty = Number(it.quantity)||1, each = Number(it.eachCost)||0, line = each*qty;
      return {...it, eachCost: Math.round((line + extras*line/sub)/qty*100)/100};
    });
  }
  async function scanReceiptWithAI(dataUrl){
    const match=dataUrl.match(/^data:([^;]+);base64,(.+)$/);
    if(!match){console.error('Receipt AI: input not a data URL');return null;}
    const mimeType=match[1], b64data=match[2];
    // Prefer dedicated receipt worker if configured, else fall back to old /receipt
    const useNewWorker = AI_PROXY_RECEIPT && !AI_PROXY_RECEIPT.includes('__RECEIPT_WORKER_URL_HERE__');
    const endpoint = useNewWorker ? AI_PROXY_RECEIPT + '/receipt' : AI_PROXY + '/receipt';
    try{
      console.log('[Receipt AI] POST', endpoint, Math.round(b64data.length/1024)+'KB', mimeType);
      const resp=await fetch(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({documentData:b64data,imageData:b64data,mediaType:mimeType})
      });
      if(!resp.ok){
        const errText = await resp.text().catch(()=>'');
        console.error('Receipt AI HTTP', resp.status, errText.slice(0,300));
        return null;
      }
      const data=await resp.json();
      if(data.debug_raw){console.warn('[Receipt AI] raw output:',data.debug_raw);}
      const raw=(data.items||'[]');
      const clean=raw.replace(/```json|```/g,'').trim();
      const arr=JSON.parse(clean);
      const items = Array.isArray(arr) ? arr : [];
      const tax = typeof data.tax === 'number' ? data.tax : parseFloat(data.tax) || 0;
      console.log('[Receipt AI] Extracted', items.length, 'items · tax $', tax.toFixed(2));
      const shipping = typeof data.shipping === 'number' ? data.shipping : parseFloat(data.shipping) || 0;
      return {items, tax, shipping, documentType: data.documentType || 'image'};
    }catch(e){console.error('Receipt AI error',e);return null;}
  }
