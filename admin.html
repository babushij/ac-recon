// ═══════════════════════════════════════════════
function renderToInstall(c){
  setTopbar('Needs installing','');
  const mechSel=ST.tiMech===undefined?(ST.role!=='manager'?ST.role:''):ST.tiMech;
  const allItems=getAllToInstall();
  const items=allItems.filter(it=>!mechSel||it.vehicle.assignedTo===mechSel||it.vehicle.assignedTo2===mechSel);
  const loose=getLooseParts();
  const byV={};
  items.forEach(it=>{(byV[it.vehicle.id]=byV[it.vehicle.id]||{vehicle:it.vehicle,items:[]}).items.push(it);});
  const arrivedMs=p=>p.deliveredDate||p.receivedDate||p.addedDate||0;
  const groups=Object.values(byV).sort((a,b)=>Math.max(...b.items.map(i=>arrivedMs(i.part)))-Math.max(...a.items.map(i=>arrivedMs(i.part))));
  groups.forEach(g=>g.items.sort((a,b)=>arrivedMs(b.part)-arrivedMs(a.part)));
  const total=items.reduce((a,it)=>a+((parseFloat(it.part.cost)||0)*(parseInt(it.part.qty)||1)),0);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const btn='font-size:11px;font-weight:600;padding:6px 11px;border-radius:7px;border:1px solid #2a2f3f;background:#1a1d27;color:#cdd3de;cursor:pointer;font-family:inherit';
  let h=`<div style="font-size:13px;color:#cdd3de;margin-bottom:10px">Parts that are in hand but not yet on the car. Newest arrivals first. Tap <b>Mark installed</b> once it is on the car.</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="ti-chip${!mechSel?' on':''}" data-m="">All cars</button>${getMechs().map(m=>`<button class="ti-chip${mechSel===m.id?' on':''}" data-m="${m.id}">${m.icon||''} ${esc(m.name)}</button>`).join('')}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
     <div style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:12px 16px"><div style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">TO INSTALL</div><div id="ti-count" style="font-size:22px;font-weight:700;color:#ddd6fe">${items.length}</div></div>
     <div style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:12px 16px"><div style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">VALUE</div><div style="font-size:22px;font-weight:700;color:#C8102E">${fmt$(total)}</div></div>
     ${allItems.length&&ST.role==='manager'?`<button id="ti-all" style="${btn};align-self:center;border-color:#4c1d95;color:#ddd6fe">🔧 Mark all ${allItems.length} as installed…</button>`:''}
   </div>`;
  if(!items.length){
    h+=`<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;padding:34px 20px;text-align:center;color:#9aa3b8"><div style="font-size:32px;opacity:.4">✅</div><div style="font-size:13px;color:#cdd3de;margin-top:6px">Nothing waiting to be installed</div></div>`;
  }
  groups.forEach(g=>{
    const v=g.vehicle;
    const mc=v.assignedTo?getMMAP()[v.assignedTo]:null;
    h+=`<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;overflow:hidden;margin-bottom:10px">
      <div class="ti-go" data-vid="${v.id}" style="padding:11px 14px;border-bottom:1px solid #1e2230;background:#0c0e13;cursor:pointer">
        <div style="font-size:13px;font-weight:600;color:#fff">🚗 ${esc(`${v.year||''} ${v.make||''} ${v.model||''}`.trim())}</div>
        <div style="font-size:11px;color:#9aa3b8">${v.stockNumber?'#'+esc(v.stockNumber):'—'} · ...${esc((v.vin||'------').slice(-6))}${mc?' · '+(mc.icon||'')+' '+esc(mc.name):''} · ${g.items.length} part${g.items.length!==1?'s':''} to install</div>
      </div>`;
    g.items.forEach(it=>{
      const p=it.part;
      const arr=arrivedMs(p);
      h+=`<div class="ti-row">
        <div style="flex:1;min-width:160px"><div style="font-size:14px;color:#e2e4ea;font-weight:600">${esc(p.name)}</div><div style="font-size:11px;color:#9aa3b8">${p.partNum?'#'+esc(p.partNum)+' · ':''}${fmt$((parseFloat(p.cost)||0)*(parseInt(p.qty)||1))}${arr?' · arrived '+new Date(arr).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div></div>
        <button class="ppl-btn ti-inst" data-vid="${v.id}" data-i="${it.partIdx}">🔧 Mark installed</button>
        <button style="${btn}" class="ti-stock" data-vid="${v.id}" data-i="${it.partIdx}" title="This part is not going on this car — keep it as inventory">📦 Not for this car</button>
      </div>`;
    });
    h+='</div>';
  });
  if(loose.length){
    const cars=(ST.vehicles||[]).filter(v=>!(currentVisit(v)?.statuses||[]).includes('sold')).slice(0,400);
    const opts=cars.map(v=>`<option value="${v.id}">${esc(`${v.stockNumber||''} ${v.year||''} ${v.make||''} ${v.model||''}`.trim())}</option>`).join('');
    h+=`<div style="font-size:11px;font-weight:700;letter-spacing:.6px;color:#bfdbfe;margin:18px 0 8px">📦 LOOSE INVENTORY (${loose.length}) — not on any car</div>`;
    loose.forEach(it=>{
      const p=it.part;
      h+=`<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:160px"><div style="font-size:13px;color:#e2e4ea">${esc(p.name)}</div><div style="font-size:10px;color:#9aa3b8">${fmt$((parseFloat(p.cost)||0)*(parseInt(p.qty)||1))}${p.fromStock?' · was on #'+esc(p.fromStock):''}</div></div>
        <select class="ti-car" data-vid="${it.vehicle.id}" data-i="${it.idx}" style="background:#111318;border:1px solid #2a2f3f;color:#e2e4ea;padding:7px;border-radius:7px;font-size:12px;max-width:220px"><option value="">Put on a car…</option>${opts}</select>
      </div>`;
    });
  }
  c.innerHTML=h;
  c.querySelectorAll('.ti-chip').forEach(b=>b.onclick=()=>{ST.tiMech=b.dataset.m;render();});
  c.querySelectorAll('.ti-go').forEach(el=>el.onclick=()=>{ST.selectedId=el.dataset.vid;ST.view='detail';ST.activeTab='repairs';render();});
  c.querySelectorAll('.ti-inst').forEach(b=>b.onclick=()=>{installPartById(b.dataset.vid,parseInt(b.dataset.i),true);toast('Marked installed');render();});
  c.querySelectorAll('.ti-stock').forEach(b=>b.onclick=()=>{partToStock(b.dataset.vid,parseInt(b.dataset.i));toast('Moved to loose inventory');render();});
  c.querySelectorAll('.ti-car').forEach(s=>s.onchange=()=>{if(!s.value)return;stockToCar(s.dataset.vid,parseInt(s.dataset.i),s.value);toast('Put on car');render();});
  const all=c.querySelector('#ti-all');
  if(all) all.onclick=()=>{ if(confirm(`Mark all ${allItems.length} received parts on ${new Set(allItems.map(x=>x.vehicle.id)).size} vehicle(s) as installed?\n\nUse this once to clear the backlog of parts that are already on the cars.`)){const n=installAllReceived();toast(`${n} parts marked installed`);render();} };
}

let _ppFilter = 'all'; // 'all' | 'ordered' | 'needed' | 'late'

function renderPartsPipeline(c){
  setTopbar('Parts pipeline', '');

  const all = getAllPendingParts();

  // Compute "late" set
  const now = Date.now();
  const isLate = (item) => item.state === 'ordered' && item.part.eta && item.part.eta < now;

  let filtered = all;
  if(_ppFilter === 'ordered') filtered = all.filter(x=>x.state==='ordered');
  else if(_ppFilter === 'needed') filtered = all.filter(x=>x.state==='needed');
  else if(_ppFilter === 'late') filtered = all.filter(isLate);

  const orderedCount = all.filter(x=>x.state==='ordered').length;
  const neededCount = all.filter(x=>x.state==='needed').length;
  const lateCount = all.filter(isLate).length;
  const totalValue = all.reduce((a,it)=> a + ((parseFloat(it.part.cost)||0) * (parseInt(it.part.qty)||1)), 0);

  // Filter chip
  const chip = (id, label, count, color) => {
    const active = _ppFilter === id;
    const bg = active ? color : 'transparent';
    const txtColor = active ? '#fff' : '#9ca3af';
    return `<button class="pp-filter" data-filter="${id}" style="font-size:11px;font-weight:600;padding:7px 13px;border-radius:7px;background:${bg};border:1px solid ${active?color:'#2a2f3f'};color:${txtColor};cursor:pointer;letter-spacing:.3px;font-family:inherit">${label}${count !== null ? ` <span style="opacity:.75">${count}</span>` : ''}</button>`;
  };

  c.innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-size:13px;color:#cdd3de;margin-bottom:10px">Track parts that aren't yet received \u00b7 ETAs, vendor, tracking, and overdue alerts</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${chip('all','All', all.length, '#C8102E')}
        ${chip('ordered','🚚 Ordered', orderedCount, '#1e40af')}
        ${chip('needed','📋 Needed', neededCount, '#7c2d12')}
        ${lateCount ? chip('late','⚠ Late', lateCount, '#7f1d1d') : ''}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px">
      <div style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">PENDING TOTAL</div>
        <div style="font-size:22px;font-weight:700;color:#C8102E;margin-top:4px">${fmt$(totalValue)}</div>
      </div>
      <div style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">🚚 ORDERED</div>
        <div style="font-size:22px;font-weight:700;color:#bfdbfe;margin-top:4px">${orderedCount}</div>
      </div>
      <div style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">📋 NEEDED</div>
        <div style="font-size:22px;font-weight:700;color:#fed7aa;margin-top:4px">${neededCount}</div>
      </div>
      ${lateCount ? `<div style="background:#7f1d1d22;border:1px solid #7f1d1d66;border-radius:10px;padding:14px">
        <div style="font-size:10px;color:#fca5a5;letter-spacing:.5px">⚠ LATE</div>
        <div style="font-size:22px;font-weight:700;color:#f87171;margin-top:4px">${lateCount}</div>
      </div>` : ''}
    </div>

    <div id="pp-list-host"></div>
  `;

  // Wire filter chips
  c.querySelectorAll('.pp-filter').forEach(btn=>{
    btn.onclick = ()=>{ _ppFilter = btn.dataset.filter; render(); };
  });

  // Build list
  const host = c.querySelector('#pp-list-host');
  if(!filtered.length){
    if(!all.length){
      host.innerHTML = `<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;padding:40px 20px;text-align:center;color:#9aa3b8">
        <div style="font-size:36px;margin-bottom:8px;opacity:.4">✅</div>
        <div style="font-size:13px;color:#cdd3de">No parts pending</div>
        <div style="font-size:11px;margin-top:4px;color:#7a8499">Parts in 'Needed' or 'Ordered' state will appear here</div>
      </div>`;
    } else {
      host.innerHTML = `<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;padding:30px 20px;text-align:center;color:#9aa3b8;font-size:13px">No parts match this filter.</div>`;
    }
    return;
  }

  // Group by vehicle
  const byVehicle = {};
  filtered.forEach(item=>{
    const vid = item.vehicle.id;
    if(!byVehicle[vid]) byVehicle[vid] = {vehicle: item.vehicle, items: []};
    byVehicle[vid].items.push(item);
  });

  let listHtml = '';
  Object.values(byVehicle).forEach(grp=>{
    const veh = grp.vehicle;
    const yMM = `${veh.year||''} ${veh.make||''} ${veh.model||''}`.trim();
    const stockStr = veh.stockNumber ? `#${veh.stockNumber}` : '—';
    const grpTotal = grp.items.reduce((a,it)=>a + ((parseFloat(it.part.cost)||0) * (parseInt(it.part.qty)||1)), 0);
    listHtml += `<div style="background:#111318;border:1px solid #1e2230;border-radius:12px;overflow:hidden;margin-bottom:10px">
      <div onclick="ST.selectedId='${veh.id}';ST.view='detail';ST.activeTab='repairs';render()" style="padding:11px 14px;border-bottom:1px solid #1e2230;background:#0c0e13;cursor:pointer;display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🚗 ${yMM}</div>
          <div style="font-size:11px;color:#9aa3b8">${stockStr} · ${grp.items.length} part${grp.items.length!==1?'s':''} pending</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:13px;font-weight:700;color:#C8102E">${fmt$(grpTotal)}</div>
          <div style="font-size:10px;color:#9aa3b8">value pending</div>
        </div>
        <span style="font-size:14px;color:#7a8499;flex-shrink:0">›</span>
      </div>
      <div>`;
    grp.items.forEach(item=>{
      const p = item.part;
      const stateBadge = item.state === 'ordered'
        ? `<span style="font-size:9px;color:#bfdbfe;background:#1e3a8a55;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;flex-shrink:0">🚚 Ordered</span>`
        : `<span style="font-size:9px;color:#fed7aa;background:#7c2d1255;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;flex-shrink:0">📋 Needed</span>`;
      let etaStr = '';
      if(item.state === 'ordered'){
        if(p.eta){
          const etaDate = new Date(p.eta);
          const days = Math.ceil((p.eta - now) / 86400000);
          const dateLabel = etaDate.toLocaleDateString('en-US',{month:'short',day:'numeric'});
          if(days < 0) etaStr = `<span style="color:#f87171;font-weight:600">⚠ Late · ${Math.abs(days)}d ago</span>`;
          else if(days === 0) etaStr = `<span style="color:#fbbf24;font-weight:600">📦 Today</span>`;
          else if(days === 1) etaStr = `<span style="color:#34d399;font-weight:600">📦 Tomorrow</span>`;
          else etaStr = `<span style="color:#cdd3de">📦 ${dateLabel} (${days}d)</span>`;
        } else if(item.daysSinceOrdered != null){
          etaStr = `<span style="color:#9aa3b8">Ordered ${item.daysSinceOrdered}d ago · No ETA</span>`;
        }
      }
      const trackingBtn = (item.state === 'ordered' && p.trackingNum)
        ? `<button onclick="event.stopPropagation();window.openTrackingSearch('${(p.trackingNum||'').replace(/'/g,'')}')" style="font-size:10px;color:#60a5fa;background:rgba(30,58,95,.4);border:1px solid rgba(30,58,95,.6);border-radius:5px;padding:4px 9px;cursor:pointer;flex-shrink:0;font-family:inherit">🔗 Track ${p.trackingNum.slice(-6)}</button>`
        : '';
      const noteLine = p.note
        ? `<div style="font-size:10px;color:#fbbf24;margin-top:3px;font-style:italic">📝 ${p.note}</div>`
        : '';
      listHtml += `
        <div style="padding:11px 14px;border-bottom:1px solid #1e2230">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap">
            ${stateBadge}
            <span style="font-size:13px;font-weight:600;color:#e2e4ea;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</span>
            <span style="font-size:12px;font-weight:700;color:#C8102E;flex-shrink:0">${fmt$((parseFloat(p.cost)||0)*(parseInt(p.qty)||1))}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#cdd3de;flex-wrap:wrap">
            ${item.vendorName?`<span style="color:#818cf8">↗ ${item.vendorName}</span>`:''}
            ${etaStr}
            ${trackingBtn}
          </div>
          ${noteLine}
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            <button class="ppl-btn ppl-receive" data-vid="${veh.id}" data-pidx="${item.partIdx}" title="Mark as received" style="font-size:11px;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid #9a341688;background:#78350f33;color:#fdba74;cursor:pointer;font-family:inherit">📦 Mark received</button>
            ${item.state === 'ordered'
              ? `<button class="ppl-btn ppl-edit-eta" data-vid="${veh.id}" data-pidx="${item.partIdx}" title="Edit ETA / Tracking" style="font-size:11px;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid #2a2f3f;background:#1e2230;color:#cdd3de;cursor:pointer;font-family:inherit">✎ Edit ETA / Tracking</button>`
              : `<button class="ppl-btn ppl-mark-ordered" data-vid="${veh.id}" data-pidx="${item.partIdx}" title="Mark as ordered" style="font-size:11px;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid #1e40af88;background:#1e3a8a33;color:#bfdbfe;cursor:pointer;font-family:inherit">🚚 Order this</button>`
            }
          </div>
        </div>`;
    });
    listHtml += `</div></div>`;
  });
  host.innerHTML = listHtml;

  // Wire action buttons
  host.querySelectorAll('.ppl-receive').forEach(btn=>{
    btn.onclick = ()=>{
      const vid = btn.dataset.vid;
      const pidx = parseInt(btn.dataset.pidx);
      const veh = ST.vehicles.find(x=>x.id===vid);
      if(!veh) return;
      const cur = currentVisit(veh);
      if(!cur || !cur.parts || !cur.parts[pidx]) return;
      const part = cur.parts[pidx];
      cur.parts[pidx] = {...part, state:'received', receivedDate:Date.now()};
      veh.parts = cur.parts;
      veh.updatedAt = Date.now();
      syncPartsStatus(veh);
      save();
      toast(`✓ "${part.name}" marked as received`);
      render();
    };
  });
  host.querySelectorAll('.ppl-edit-eta, .ppl-mark-ordered').forEach(btn=>{
    btn.onclick = ()=>{
      const vid = btn.dataset.vid;
      const pidx = parseInt(btn.dataset.pidx);
      // Open the order/ETA dialog inline (mini version that doesn't require renderDetail context)
      window.openOrderDialogStandalone(vid, pidx, ()=>render());
    };
  });
}

// Standalone order/ETA dialog (works outside the renderDetail closure too)
window.openOrderDialogStandalone = function(vid, pidx, onSaved){
  const veh = ST.vehicles.find(x=>x.id===vid);
  if(!veh) return;
  const cur = currentVisit(veh);
  if(!cur || !cur.parts || !cur.parts[pidx]) return;
  const p = cur.parts[pidx];
  const isOrdering = p.state !== 'ordered';
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9990;display:flex;align-items:center;justify-content:center;padding:18px';
  const etaVal = p.eta ? new Date(p.eta).toISOString().slice(0,10) : '';
  const trackingVal = (p.trackingNum||'').replace(/"/g,'&quot;');
  const noteVal = (p.note||'').replace(/"/g,'&quot;');
  overlay.innerHTML = `
    <div style="max-width:440px;width:100%;background:#111318;border:1px solid #2a2f3f;border-radius:14px;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid #1e2230;display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:14px;font-weight:700;color:#fff">${isOrdering ? '🚚 Mark as ordered' : '✎ Edit order details'}</div>
        <button id="pos-close" style="background:transparent;border:1px solid #374151;color:#fff;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer">Close</button>
      </div>
      <div style="padding:16px">
        <div style="font-size:13px;color:#e2e4ea;margin-bottom:14px;padding:8px 12px;background:#0c0e13;border-radius:8px;border-left:3px solid #C8102E">
          <strong>${p.name}</strong>${p.partNum?` <span style="color:#9aa3b8">#${p.partNum}</span>`:''}
        </div>
        <div class="field"><label>Expected arrival (optional)</label><input id="pos-eta" type="date" value="${etaVal}" style="width:100%;background:#0a0c10;border:1px solid #1e2230;border-radius:8px;padding:9px 10px;color:#e2e4ea;font-size:13px"></div>
        <div class="field"><label>Tracking # (optional)</label><input id="pos-tracking" value="${trackingVal}" placeholder="e.g. 1Z999AA10123456784" style="width:100%;background:#0a0c10;border:1px solid #1e2230;border-radius:8px;padding:9px 10px;color:#e2e4ea;font-size:13px;font-family:ui-monospace,monospace"></div>
        <div class="field"><label>Note (optional)</label><input id="pos-note" value="${noteVal}" placeholder="e.g. Backorder, drop-shipping from Atlanta" style="width:100%;background:#0a0c10;border:1px solid #1e2230;border-radius:8px;padding:9px 10px;color:#e2e4ea;font-size:13px"></div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid #1e2230;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-red" id="pos-save" style="padding:9px 18px;border-radius:8px;font-size:13px">${isOrdering ? '🚚 Mark as ordered' : 'Save changes'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup=()=>overlay.remove();
  overlay.querySelector('#pos-close').onclick=cleanup;
  overlay.onclick=(e)=>{if(e.target===overlay) cleanup();};
  overlay.querySelector('#pos-save').onclick=()=>{
    const etaInput = overlay.querySelector('#pos-eta').value;
    const eta = etaInput ? new Date(etaInput+'T12:00:00').getTime() : null;
    const trackingNum = overlay.querySelector('#pos-tracking').value.trim();
    const note = overlay.querySelector('#pos-note').value.trim();
    cur.parts[pidx] = {
      ...p,
      state: 'ordered',
      orderedDate: p.orderedDate || Date.now(),
      eta: eta || null,
      trackingNum: trackingNum || '',
      note: note || ''
    };
    veh.parts = cur.parts;
    veh.updatedAt = Date.now();
    syncPartsStatus(veh);
    save();
    cleanup();
    toast(isOrdering ? `🚚 "${p.name}" marked as ordered` : `Order details saved`);
    if(onSaved) onSaved();
  };
};

// RECON ANALYTICS — avg cost/time per status, mechanic, vehicle class
// ═══════════════════════════════════════════════
let _analyticsRange = 'all'; // 'all' | '30d' | '90d' | 'ytd'

function renderAnalytics(c){
  setTopbar('Recon analytics', '');

  const now = Date.now();
  const cutoffs = {
    'all': 0,
    '30d': now - 30*86400000,
    '90d': now - 90*86400000,
    'ytd': new Date(new Date().getFullYear(),0,1).getTime()
  };
  const cutoff = cutoffs[_analyticsRange] || 0;

  // Walk all vehicles + all visits, collecting completed visits
  // A visit is "completed" if it has work_complete, cleaning, sale, sold, OR receipts_in
  const COMPLETE = new Set(['work_complete','cleaning','sale','sold','receipts_in','booked']);

  const visitsList = [];
  (ST.vehicles||[]).forEach(veh=>{
    (veh.visits||[]).forEach(visit=>{
      const sts = visit.statuses||[];
      const isComplete = sts.some(s=>COMPLETE.has(s));
      if(!isComplete) return;
      const tIn = visit.dateIn || veh.createdAt || 0;
      const tOut = visit.dateOut || veh.updatedAt || now;
      if(tOut < cutoff) return;
      const partsTotal=(visit.parts||[]).reduce((a,p)=>a+((parseFloat(p.cost)||0)*(parseInt(p.qty)||1)),0);
      const laborTotal=(visit.laborLines||[]).reduce((a,l)=>a+((parseFloat(l.hours)||0)*(parseFloat(l.rate)||0)),0);
      const legacyTotal=(visit.repairs||[]).reduce((a,r)=>a+Number(r.cost||0),0);
      const totalCost = partsTotal+laborTotal+legacyTotal;
      const cycleDays = Math.max(1, Math.round((tOut - tIn)/86400000));
      // Total clocked hours for this visit
      const clockedMs = (visit.timeSessions||[]).reduce((a,s)=>{
        if(!s.start||!s.end) return a;
        return a + (s.end - s.start);
      }, 0);
      const clockedHrs = clockedMs / 3600000;
      visitsList.push({
        veh, visit, sts, totalCost, cycleDays, clockedHrs,
        mechId: visit.assignedTo || '',
        // Vehicle class proxies — make-based grouping for simplicity
        make: (veh.make||'Unknown').trim(),
        year: parseInt(veh.year)||0
      });
    });
  });

  // Aggregate helper
  function agg(items, keyFn, labelFn){
    const buckets = {};
    items.forEach(it=>{
      const keys = keyFn(it);
      (Array.isArray(keys)?keys:[keys]).forEach(k=>{
        if(!k) return;
        if(!buckets[k]) buckets[k] = {key:k, label:labelFn?labelFn(k,it):k, count:0, costSum:0, daysSum:0, hoursSum:0};
        buckets[k].count++;
        buckets[k].costSum += it.totalCost;
        buckets[k].daysSum += it.cycleDays;
        buckets[k].hoursSum += it.clockedHrs;
      });
    });
    return Object.values(buckets).map(b=>({
      ...b,
      avgCost: b.count ? b.costSum/b.count : 0,
      avgDays: b.count ? b.daysSum/b.count : 0,
      avgHours: b.count ? b.hoursSum/b.count : 0
    })).sort((a,b)=>b.costSum-a.costSum);
  }

  const totalCount = visitsList.length;
  const totalCost = visitsList.reduce((a,it)=>a+it.totalCost,0);
  const avgCycle = totalCount ? visitsList.reduce((a,it)=>a+it.cycleDays,0)/totalCount : 0;
  const avgCost = totalCount ? totalCost/totalCount : 0;
  const totalHours = visitsList.reduce((a,it)=>a+it.clockedHrs,0);

  const byStatus = agg(
    visitsList,
    it=>it.sts.filter(s=>COMPLETE.has(s)),
    k=>(SMAP[k]?SMAP[k].icon+' '+SMAP[k].label:k)
  );
  const byMech = agg(
    visitsList,
    it=>it.mechId,
    k=>{const m=getMMAP()[k];return m?(m.icon+' '+m.name):k;}
  );
  const byMake = agg(
    visitsList,
    it=>it.make,
    k=>k
  );

  // Cost-per-month trend (last 12 months or fewer if range is shorter)
  const monthBuckets = {};
  visitsList.forEach(it=>{
    const d = new Date(it.visit.dateOut || it.visit.dateIn || now);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!monthBuckets[key]) monthBuckets[key]={key,count:0,cost:0};
    monthBuckets[key].count++;
    monthBuckets[key].cost += it.totalCost;
  });
  const months = Object.values(monthBuckets).sort((a,b)=>a.key.localeCompare(b.key)).slice(-12);
  const monthMaxCost = Math.max(1, ...months.map(m=>m.cost));

  // Build the page
  const rangeBtns = [
    {id:'30d', label:'30 days'},
    {id:'90d', label:'90 days'},
    {id:'ytd', label:'YTD'},
    {id:'all', label:'All time'}
  ];

  function tableHtml(rows, label){
    if(!rows.length) return `<div style="color:#7a8499;font-size:13px;padding:14px 0;text-align:center">No data in this range</div>`;
    return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:1px solid #2a2f3f;color:#cdd3de;text-align:left">
        <th style="padding:8px 10px;font-weight:600;font-size:11px;letter-spacing:.5px">${label.toUpperCase()}</th>
        <th style="padding:8px 10px;font-weight:600;font-size:11px;text-align:right">VISITS</th>
        <th style="padding:8px 10px;font-weight:600;font-size:11px;text-align:right">AVG COST</th>
        <th style="padding:8px 10px;font-weight:600;font-size:11px;text-align:right">AVG DAYS</th>
        <th style="padding:8px 10px;font-weight:600;font-size:11px;text-align:right">AVG HRS</th>
        <th style="padding:8px 10px;font-weight:600;font-size:11px;text-align:right">TOTAL</th>
      </tr></thead>
      <tbody>${rows.map(r=>`
        <tr style="border-bottom:1px solid #1e2230">
          <td style="padding:9px 10px;color:#e2e4ea">${r.label}</td>
          <td style="padding:9px 10px;text-align:right;color:#cdd3de">${r.count}</td>
          <td style="padding:9px 10px;text-align:right;color:#cdd3de">${fmt$(r.avgCost)}</td>
          <td style="padding:9px 10px;text-align:right;color:#cdd3de">${r.avgDays.toFixed(1)}</td>
          <td style="padding:9px 10px;text-align:right;color:#cdd3de">${r.avgHours.toFixed(1)}</td>
          <td style="padding:9px 10px;text-align:right;color:#C8102E;font-weight:600">${fmt$(r.costSum)}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  c.innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-size:13px;color:#cdd3de;margin-bottom:10px">Recon spend, cycle time, and labor across completed visits</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${rangeBtns.map(b=>`<button class="an-range ${_analyticsRange===b.id?'active':''}" data-range="${b.id}" style="font-size:12px;padding:7px 14px;border-radius:7px;background:${_analyticsRange===b.id?'#C8102E':'#1e2230'};border:1px solid ${_analyticsRange===b.id?'#C8102E':'#2a2f3f'};color:#fff;cursor:pointer">${b.label}</button>`).join('')}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px">
      <div class="ov-card" style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div class="ov-label" style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">COMPLETED VISITS</div>
        <div class="ov-val" style="font-size:22px;font-weight:700;color:#fff;margin-top:4px">${totalCount}</div>
      </div>
      <div class="ov-card" style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div class="ov-label" style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">TOTAL RECON SPEND</div>
        <div class="ov-val" style="font-size:22px;font-weight:700;color:#C8102E;margin-top:4px">${fmt$(totalCost)}</div>
      </div>
      <div class="ov-card" style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div class="ov-label" style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">AVG PER VEHICLE</div>
        <div class="ov-val" style="font-size:22px;font-weight:700;color:#fff;margin-top:4px">${fmt$(avgCost)}</div>
      </div>
      <div class="ov-card" style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div class="ov-label" style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">AVG CYCLE TIME</div>
        <div class="ov-val" style="font-size:22px;font-weight:700;color:#fff;margin-top:4px">${avgCycle.toFixed(1)}d</div>
      </div>
      <div class="ov-card" style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px">
        <div class="ov-label" style="font-size:10px;color:#9aa3b8;letter-spacing:.5px">TOTAL LABOR HRS</div>
        <div class="ov-val" style="font-size:22px;font-weight:700;color:#fff;margin-top:4px">${totalHours.toFixed(1)}</div>
      </div>
    </div>

    ${months.length ? `
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title">Monthly recon spend trend</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding:10px 4px 0">
        ${months.map(m=>{
          const h = Math.max(4, Math.round(120*m.cost/monthMaxCost));
          const monthLabel = (() => {
            const [y, mo] = m.key.split('-');
            return new Date(parseInt(y), parseInt(mo)-1, 1).toLocaleDateString('en-US',{month:'short'});
          })();
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0">
            <div style="font-size:9px;color:#cdd3de;white-space:nowrap">${fmt$(m.cost)}</div>
            <div title="${monthLabel} · ${m.count} visits · ${fmt$(m.cost)}" style="width:100%;max-width:40px;height:${h}px;background:linear-gradient(to top,#C8102E,#C8102E66);border-radius:4px 4px 0 0"></div>
            <div style="font-size:10px;color:#9aa3b8">${monthLabel}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title">By status</div>
      ${tableHtml(byStatus, 'Status')}
    </div>

    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title">By mechanic</div>
      ${tableHtml(byMech, 'Mechanic')}
    </div>

    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title">By vehicle make</div>
      ${tableHtml(byMake, 'Make')}
    </div>

    ${totalCount===0 ? `

  c.querySelectorAll('.an-range').forEach(btn=>{

// NEEDS FILING — vendor invoices imported by the ac-recon-mail Worker (v31)
// Reads shops/automotive_connection/invoices (status 'needs_filing'); each line is
// filed to a vehicle (parts added to its current visit + the emailed receipt copy
// attached) or to Shop (tools / supplies). Invoices that look like they were already
// scanned in by hand get an "Already on file" suggestion: attach the email receipt
// to that car without adding duplicate parts.
// Nothing here deletes anything; vehicle writes go through writeToCurrentVisit + save().
// ═══════════════════════════════════════
let INV={list:[],loaded:false,error:null,unsub:null,sel:null,draft:{},busy:false,deliveries:[],delUnsub:null};
const deliveriesCol=()=>db.collection('shops').doc('automotive_connection').collection('deliveries');
const invoicesCol=()=>db.collection('shops').doc('automotive_connection').collection('invoices');

function tsMs(t){
  if(!t) return null;
  if(typeof t==='number') return t;
  if(typeof t.toDate==='function') return t.toDate().getTime();
  if(typeof t.seconds==='number') return t.seconds*1000;
  const d=new Date(t); return isNaN(d)?null:d.getTime();
}
// A small colour-coded badge per vendor (initials on a distinct colour) so the list is easy to scan.
// These are our own neutral badges, not the vendors' logos.

const _alnum=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const _stop=new Set(['the','and','for','with','new','set','kit','oem','front','rear','left','right','genuine','assembly','assy','part','parts','auto','car','truck']);
function _titleWords(t){return new Set(String(t||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!_stop.has(w)));}
// Every ordered part on every vehicle (any visit), with where it lives.
function orderedPartsAll(){
  const out=[];
  (ST.vehicles||[]).forEach(v=>{const visits=(v.visits&&v.visits.length)?v.visits:[v];visits.forEach(vi=>(vi.parts||[]).forEach(p=>{if(partState(p)==='ordered')out.push({v,part:p});}));});
  return out;
}
// Which ordered part does this delivery email belong to? Order number first, then tracking number, then a unique title match.
function matchDelivery(d){
  const cands=orderedPartsAll();
  const onum=_alnum(d.orderNumber), trk=_alnum(d.trackingNum);
  let hit=onum&&cands.filter(c=>_alnum(c.part.orderNumber)===onum);
  if(hit&&hit.length) return {parts:hit,by:'order number'};
  hit=trk&&cands.filter(c=>_alnum(c.part.trackingNum)===trk);
  if(hit&&hit.length) return {parts:hit,by:'tracking number'};
  const titles=(Array.isArray(d.itemTitles)?d.itemTitles:[]).map(_titleWords).filter(w=>w.size);
  if(!titles.length) return null;
  const vend=_alnum(d.vendorName||d.vendor);
  const scored=[];
  cands.forEach(c=>{
    const vn=_alnum((c.part.vendor&&getVendorById(c.part.vendor)||{}).name);
    if(vn&&vend&&!(vn.includes(vend)||vend.includes(vn))) return;      // ordered from a different vendor
    if(c.part.orderNumber&&onum&&_alnum(c.part.orderNumber)!==onum) return; // belongs to a different order
    const pw=_titleWords(c.part.name); if(pw.size<2) return;
    titles.forEach(tw=>{const shared=[...pw].filter(w=>tw.has(w)).length;const ratio=shared/Math.min(pw.size,tw.size);if(shared>=2&&ratio>=0.6) scored.push({c,ratio,shared});});
  });
  if(!scored.length) return null;
  scored.sort((a,b)=>b.ratio-a.ratio||b.shared-a.shared);
  if(scored.length>1&&scored[1].c.part!==scored[0].c.part&&scored[1].ratio>=scored[0].ratio-0.1) return null; // ambiguous → leave for a person
  return {parts:[scored[0].c],by:'item title'};
}
let _applyingDeliveries=false;
async function applyDeliveries(){
  if(_applyingDeliveries||ST.role!=='manager'||!db||!(ST.vehicles||[]).length||!INV.deliveries.length) return;
  _applyingDeliveries=true;
  try{
    let flipped=0;const changedV=new Set();const done=[];
    for(const d of INV.deliveries){
      const m=matchDelivery(d); if(!m) continue;
      m.parts.forEach(c=>{
        c.part.state='received';c.part.receivedDate=d.deliveredMs;c.part.deliveredVia='email';c.part.deliveredDate=d.deliveredMs;
        changedV.add(c.v.id);flipped++;
      });
      done.push({d,m});
    }
    if(!flipped) return;
    changedV.forEach(id=>{const v=getV(id);if(!v)return;const cv=currentVisit(v);writeToCurrentVisit(v,'parts',[...((cv&&cv.parts)||v.parts||[])]);syncPartsStatus(v);});
    save();
    for(const {d,m} of done){
      try{await deliveriesCol().doc(d.id).set({matched:true,matchedAt:firebase.firestore.FieldValue.serverTimestamp(),matchedBy:m.by,vehicleIds:[...new Set(m.parts.map(c=>c.v.id))],partNames:m.parts.map(c=>c.part.name).slice(0,6)},{merge:true});}catch(e){console.warn('delivery mark:',e);}
    }
    toast(`📦 ${flipped} part${flipped!==1?'s':''} delivered per email — marked received`);
    render();
  }finally{_applyingDeliveries=false;}
}

const invEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const invMoney=n=>{const v=Math.round((parseFloat(n)||0)*100)/100;return (v<0?'-$':'$')+Math.abs(v).toFixed(2);};
const vehName=v=>`${v.year||''} ${v.make||''} ${v.model||''}`.replace(/\s+/g,' ').trim()||'(no name)';
const vehLast6=v=>String(v.vin||'').slice(-6).toUpperCase();
function vehIsActive(v){const cv=currentVisit(v);return !(cv&&(cv.statuses||[]).includes('booked'));}
function getDraft(inv){
  if(!INV.draft[inv.id]) INV.draft[inv.id]={assign:{},edits:{},onFileDismissed:false};
  if(!INV.draft[inv.id].edits) INV.draft[inv.id].edits={};
  return INV.draft[inv.id];
}
// A line with the user's quantity / each-price corrections applied (edits live in the draft until filed).
// eBay / RockAuto emails are ORDER confirmations: the parts are normally still on the way. Portal invoices are already in hand.
function isEmailInvoice(inv){return !/portal$/.test(inv.source||'');}
function invPartState(inv){
  const d=getDraft(inv);
  if(d.partState) return d.partState;
  if(!isEmailInvoice(inv)) return 'received';
  return (Date.now()-(inv.invoiceMs||Date.now()))>21*86400000?'received':'ordered';
}
function effLine(inv,l){
  const e=getDraft(inv).edits[l.idx]||{};
  // Returns / credits carry a negative quantity; the editor shows the count, the sign stays with the line.
  const sign=(l.isReturn||(parseInt(l.quantity)||0)<0)?-1:1;
  const quantity=sign*Math.max(1,Math.abs(parseInt(e.quantity!=null?e.quantity:l.quantity))||1);
  const eachCost=Math.max(0,Math.round(Math.abs(parseFloat(e.eachCost!=null?e.eachCost:l.eachCost)||0)*100)/100);
  return {...l,quantity,eachCost,lineTotal:Math.round(eachCost*quantity*100)/100,edited:!!(e.quantity!=null||e.eachCost!=null)};
}
function invTotals(inv){
  const lines=inv.lines.map(l=>effLine(inv,l));
  const linesSum=Math.round(lines.reduce((a,l)=>a+l.lineTotal,0)*100)/100;
  const extras=(parseFloat(inv.shipping)||0)+(parseFloat(inv.tax)||0);
  const computed=Math.round((linesSum+extras)*100)/100;
  const stated=inv.total!=null?Math.round((parseFloat(inv.total)||0)*100)/100:null;
  const diff=stated!=null?Math.round((computed-stated)*100)/100:0;
  return {lines,linesSum,extras,computed,stated,diff,mismatch:stated!=null&&Math.abs(diff)>0.05};
}

// ── "Already on file?" — compare invoice lines against parts already on vehicles (scanned in by hand) ──
const _norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const _words=s=>new Set(String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2));
// Find the part on a vehicle that an invoice line refers to: part number first, then same price + overlapping words,
// then (loosely) overlapping words alone — a misread price should not hide the match. Returns {part, strong}.
function matchPart(parts,l,used){
  used=used||new Set();
  const pn=_norm(l.partNumber);const lw=_words(l.description);const cost=parseFloat(l.eachCost)||0;
  const overlap=p=>{const pw=_words(p.name);let n=0;lw.forEach(w=>{if(pw.has(w))n++;});return n;};
  const free=parts.filter(p=>!used.has(p));
  let hit=pn&&pn.length>=4?free.find(p=>_norm(p.partNum)===pn):null;
  if(hit) return {part:hit,strong:true};
  hit=free.find(p=>cost>0&&Math.abs((parseFloat(p.cost)||0)-cost)<0.015&&(overlap(p)>=2||(overlap(p)>=1&&lw.size<=2)));
  if(hit) return {part:hit,strong:false};
  hit=lw.size>=2?free.find(p=>overlap(p)>=Math.min(3,lw.size)&&overlap(p)>=2):null;
  return hit?{part:hit,strong:false,loose:true}:null;
}
function findOnFile(inv){
  let best=null;
  for(const v of ST.vehicles){
    const parts=[],receipts=[];
    (v.visits&&v.visits.length?v.visits:[v]).forEach(vi=>{(vi.parts||[]).forEach(p=>parts.push(p));(vi.receipts||[]).forEach(r=>receipts.push(r));});
    if(!parts.length) continue;
    let matched=0,strong=0;const used=new Set();
    inv.lines.forEach(l=>{
      const m=matchPart(parts,l,used);
      if(m){matched++;used.add(m.part);if(m.strong)strong++;}
    });
    if(!matched) continue;
    const nearReceipt=receipts.some(r=>Math.abs((r.date||r.uploadedAt||0)-inv.invoiceMs)<10*86400000);
    const ok=strong>0||matched>=Math.max(1,Math.ceil(inv.lines.length/2));
    const score=matched+(strong?1:0)+(nearReceipt?0.5:0);
    if(ok&&(!best||score>best.score)) best={v,matched,strong,nearReceipt,score};
  }
  return best;
}

// ── Vendor id for parts rows (creates the vendor in Settings the first time) ──
function ensurePartsVendor(name){
  if(!name) return '';
  const hit=getVendors('parts').find(x=>(x.name||'').trim().toLowerCase()===name.trim().toLowerCase());
  if(hit) return hit.id;
  const made=addVendor('parts',{name});
  return made?made.id:'';
}

// ── Filing: write parts + receipt copy to vehicles, mark invoice filed ──
async function fileInvoice(inv,mode){
  // mode: 'sort' (lines assigned in draft)
  //     | {attachTo: vehicleId}                  already on file: attach the email receipt only, parts untouched
  //     | {attachTo: vehicleId, updateParts:true} already on file: correct the matching parts' qty/price from the (edited) invoice, add any unmatched line, attach receipt
  if(INV.busy) return;
  const draft=getDraft(inv);
  const lines=inv.lines.map(l=>effLine(inv,l));
  const byVeh={};const shopIdx=[];
  const assignOf={};
  if(mode&&mode.attachTo){
    lines.forEach(l=>{assignOf[l.idx]={kind:'vehicle',vehicleId:mode.attachTo};});
  } else {
    lines.forEach(l=>{const a=draft.assign[l.idx];if(!a) throw new Error('Every line needs a vehicle or Shop');assignOf[l.idx]=a;});
  }
  const empLines=[];
  lines.forEach(l=>{const a=assignOf[l.idx];if(a.kind==='shop')shopIdx.push(l.idx);else if(a.kind==='employee')empLines.push({l,employeeId:a.employeeId});else(byVeh[a.vehicleId]=byVeh[a.vehicleId]||[]).push(l);});
  const vendorId=ensurePartsVendor(inv.vendorName);
  const filedState=(mode&&mode.attachTo)?'received':invPartState(inv);
  INV.busy=true;
  try{
    let touched=0,updated=0,added=0;
    const newPartFrom=l=>({
      // a return goes on the car as a negative-cost part so the vehicle's parts total comes down
      name:l.description||'',partNum:l.partNumber||'',cost:((parseInt(l.quantity)||1)<0?-1:1)*(parseFloat(l.eachCost)||0),qty:Math.abs(parseInt(l.quantity))||1,
      vendor:vendorId,source:'invoice',invoiceId:inv.id,orderNumber:inv.orderNumber||'',
      ...(filedState==='ordered'?{state:'ordered',orderedDate:inv.invoiceMs}:{state:'received',receivedDate:inv.invoiceMs})
    });
    for(const vid of Object.keys(byVeh)){
      const v=getV(vid);if(!v) throw new Error('Vehicle not found: '+vid);
      if(mode&&mode.attachTo&&mode.updateParts){
        // Correct the parts this invoice refers to, wherever they sit on the vehicle (any visit); add lines that match nothing.
        const visits=(v.visits&&v.visits.length)?v.visits:[v];
        const all=[];visits.forEach(vi=>(vi.parts||[]).forEach(p=>all.push(p)));
        const used=new Set();const extra=[];
        byVeh[vid].forEach(l=>{
          const m=matchPart(all,l,used);
          if(m){
            used.add(m.part);
            m.part.cost=parseFloat(l.eachCost)||0;m.part.qty=parseInt(l.quantity)||1;
            if(!m.part.partNum&&l.partNumber) m.part.partNum=l.partNumber;
            if(!m.part.vendor&&vendorId) m.part.vendor=vendorId;
            m.part.invoiceId=inv.id;m.part.orderNumber=inv.orderNumber||'';m.part.correctedAt=Date.now();
            updated++;
          } else { extra.push(newPartFrom(l)); added++; }
        });
        // write the (mutated) current-visit parts back through the shim so it mirrors + syncs; other visits were edited in place
        const cv=currentVisit(v);
        writeToCurrentVisit(v,'parts',[...((cv&&cv.parts)||v.parts||[]),...extra]);
        syncPartsStatus(v);
      } else if(!(mode&&mode.attachTo)){
        const newParts=[...(v.parts||[]),...byVeh[vid].map(newPartFrom)];
        writeToCurrentVisit(v,'parts',newParts);
        syncPartsStatus(v);
        added+=byVeh[vid].length;
      }
      if(inv.receipt&&inv.receipt.url){
        const have=(v.receipts||[]).some(r=>r&&r.path===inv.receipt.path);
        if(!have) writeToCurrentVisit(v,'receipts',[...(v.receipts||[]),{
          url:inv.receipt.url,path:inv.receipt.path||'',uploadedAt:inv.receipt.uploadedAt||Date.now(),
          name:inv.receipt.name||(inv.vendorName+' email receipt.html'),date:inv.invoiceMs,source:'invoice',invoiceId:inv.id
        }]);
      }
      touched++;
    }
    if(touched) save();
    // Core lines filed to a vehicle → tag the matching core record so the Cores page shows the car
    try{
      const coreLines=lines.filter(l=>l.isCore&&!l.isReturn&&assignOf[l.idx]&&assignOf[l.idx].kind==='vehicle');
      for(const l of coreLines){const c=COR.list.find(x=>x.invoiceId===inv.id&&x.id===inv.id+'_'+l.idx);if(c&&c.vehicleId!==assignOf[l.idx].vehicleId) await coresCol().doc(c.id).set({vehicleId:assignOf[l.idx].vehicleId},{merge:true});}
    }catch(e){console.warn('core tag:',e);}
    // Employee charges: one record per line, open until marked paid / deducted on the Employee accounts page.
    if(empLines.length){
      const batch=db.batch();
      empLines.forEach(({l,employeeId})=>{
        const emp=getEmployee(employeeId);
        batch.set(chargesCol().doc(`${inv.id}_${l.idx}`),{
          employeeId,employeeName:emp?emp.name:'',invoiceId:inv.id,lineIdx:l.idx,vendor:inv.vendor||'',vendorName:inv.vendorName||'',orderNumber:inv.orderNumber||'',
          description:l.description||'',partNumber:l.partNumber||'',quantity:l.quantity,eachCost:l.eachCost,amount:l.lineTotal,
          date:new Date(inv.invoiceMs),status:'open',settledAt:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:ST.role||'manager',
          receiptUrl:(inv.receipt&&inv.receipt.url)||null
        },{merge:true});
      });
      await batch.commit();
    }
    const outLines=lines.map(l=>{const o={};Object.keys(l).forEach(k=>{if(l[k]!==undefined&&k!=='edited')o[k]=l[k];});o.assign=assignOf[l.idx];if(l.edited){o.corrected=true;o.original={quantity:inv.lines[l.idx].quantity,eachCost:inv.lines[l.idx].eachCost};}return o;});
    const t=invTotals(inv);
    await invoicesCol().doc(inv.id).set({
      status:'filed',filedAt:firebase.firestore.FieldValue.serverTimestamp(),filedBy:ST.role||'manager',
      filedMode:(mode&&mode.attachTo)?(mode.updateParts?'parts_updated':'attach_existing'):'parts_added',
      lines:outLines,linesSum:t.linesSum,vehicleIds:Object.keys(byVeh),shopLineCount:shopIdx.length,employeeLineCount:empLines.length,employeeIds:[...new Set(empLines.map(x=>x.employeeId))]
    },{merge:true});
    delete INV.draft[inv.id];
    INV.sel=null;
    if(filedState==='ordered'){try{setTimeout(applyDeliveries,300);}catch(e){}}
    const n=Object.keys(byVeh).length;
    toast((mode&&mode.attachTo)?(mode.updateParts?`${vehName(getV(mode.attachTo))}: ${updated} part${updated!==1?'s':''} corrected${added?`, ${added} added`:''} · receipt attached`:'Receipt attached to '+vehName(getV(mode.attachTo))):`Filed${filedState==='ordered'?' as ordered':''} · ${n} vehicle${n!==1?'s':''}${shopIdx.length?` · ${shopIdx.length} shop line${shopIdx.length!==1?'s':''}`:''}${empLines.length?` · ${empLines.length} employee charge${empLines.length!==1?'s':''}`:''}`);
  }catch(e){
    console.error('File invoice failed:',e);
    toast('Filing failed: '+(e.message||e),'err');
  }finally{INV.busy=false;render();}
}

      <button id="vp-close" style="width:44px;height:44px;background:transparent;border:none;color:#b8c3d3;font-size:20px;cursor:pointer">✕</button>
    </div>
    <div style="padding:6px 16px 8px"><input id="vp-q" type="search" placeholder="Last 6 of VIN, stock #, or model" autocomplete="off" style="width:100%;height:44px;padding:0 12px;background:#131824;border:1px solid #243048;border-radius:6px;color:#eef0f6;font-size:15px"></div>
    <label style="display:flex;align-items:center;gap:8px;padding:0 16px 8px;font-size:12px;color:#8a9ab0;cursor:pointer"><input id="vp-all" type="checkbox"> Include completed / sold vehicles</label>
    <div id="vp-list" style="overflow-y:auto;padding:0 16px 24px"></div>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.querySelector('#vp-close').onclick=close;
  overlay.onclick=e=>{if(e.target===overlay)close();};
  const q=overlay.querySelector('#vp-q'),all=overlay.querySelector('#vp-all'),list=overlay.querySelector('#vp-list');
  const tagFor=v=>{
    const cv=currentVisit(v);const st=(cv&&cv.statuses)||[];
    if(st.includes('booked')) return ['Completed','#1a2035','#8a9ab0'];
    if(st.includes('parts')) return ['Waiting on parts','#2a1a06','#fbbf24'];
    if((cv&&cv.assignedTo)||v.assignedTo) return ['In shop','#0b1a2e','#7cb4f5'];
    return ['Active','#052e1f','#4ade80'];
  };
  const draw=()=>{
    const s=q.value.trim().toLowerCase();
    let rows=ST.vehicles.filter(v=>all.checked||vehIsActive(v));
    if(s) rows=rows.filter(v=>(`${vehName(v)} ${v.stockNumber||''} ${v.vin||''}`).toLowerCase().includes(s));
    rows.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    rows=rows.slice(0,60);
    if(!rows.length){list.innerHTML=`<div style="padding:24px 0;text-align:center;font-size:13px;color:#8a9ab0">No vehicle matches.</div>`;return;}
    list.innerHTML=rows.map(v=>{const [t,bg,fg]=tagFor(v);return `<button data-id="${invEsc(v.id)}" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 12px;margin:0 0 8px;background:#131824;border:1px solid #1a2035;border-radius:8px;color:#eef0f6;cursor:pointer;min-height:56px;font-family:inherit">
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${invEsc(vehName(v))}</div>
      <div style="font-size:11px;color:#8a9ab0;margin-top:3px">#${invEsc(v.stockNumber||'—')} · VIN …<b style="color:#fff;font-weight:800;letter-spacing:.5px;font-family:'Courier New',monospace">${invEsc(vehLast6(v))}</b></div></div>
      <span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;background:${bg};color:${fg}">${t}</span></button>`;}).join('');
    list.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{close();onPick(b.getAttribute('data-id'));});
  };
  q.oninput=draw;all.onchange=draw;draw();
  setTimeout(()=>q.focus(),50);
}

// ── CORES — core charges opened by vendor invoices, closed automatically when the credit comes through ──
let COR={list:[],loaded:false,error:null,unsub:null,showSettled:false};
const coresCol=()=>db.collection('shops').doc('automotive_connection').collection('cores');
const CORE_OVERDUE_DAYS=30;
function subscribeToCores(){
  if(!db) return;
  if(COR.unsub){try{COR.unsub();}catch(e){}}
  COR.unsub=coresCol().onSnapshot(snap=>{
    COR.list=snap.docs.map(d=>{const x=d.data();return {...x,id:d.id,openedMs:tsMs(x.openedAt),returnedMs:tsMs(x.returnedAt)};});
    COR.loaded=true;COR.error=null;
    if(ST.view==='cores') render(); else if(ST.role==='manager'){try{buildSidebar();}catch(e){}}
  },err=>{COR.error=err;COR.loaded=true;if(ST.view==='cores') render();});
}
function coreDays(c){return c.openedMs?Math.floor((Date.now()-c.openedMs)/86400000):0;}
function coreIsOverdue(c){return c.status==='open'&&coreDays(c)>=CORE_OVERDUE_DAYS;}
function openCoreCount(){return COR.list.filter(c=>c.status==='open').length;}
function overdueCoreCount(){return COR.list.filter(coreIsOverdue).length;}
async function settleCore(id,status,note){
  try{
    const patch={status,manualAt:firebase.firestore.FieldValue.serverTimestamp(),manualBy:ST.role||'manager'};
    if(status==='returned'){patch.returnedAt=firebase.firestore.FieldValue.serverTimestamp();patch.returnInvoiceId='manual';}
    if(status==='open'){patch.returnedAt=null;patch.returnInvoiceId=null;}
    if(note!=null) patch.note=note;
    await coresCol().doc(id).set(patch,{merge:true});
    toast(status==='returned'?'Core marked returned':status==='written_off'?'Core written off':'Core reopened');
  }catch(e){toast('Could not update core: '+(e.message||e),'err');}
}
function renderCores(c){
  if(ST.role!=='manager'){c.innerHTML='<div class="empty"><div class="empty-msg">Manager access only</div></div>';return;}
  setTopbar('Cores','');
  if(COR.error){c.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-msg">Can't read cores</div><div class="empty-sub" style="color:#f87171;font-family:monospace;font-size:12px">${invEsc((COR.error.code||'')+' '+(COR.error.message||''))}</div></div>`;return;}
  if(!COR.loaded){c.innerHTML='<div class="empty"><div class="empty-msg">Loading…</div></div>';return;}
  const open=COR.list.filter(x=>x.status==='open').sort((a,b)=>(a.openedMs||0)-(b.openedMs||0));
  const overdue=open.filter(coreIsOverdue), fresh=open.filter(x=>!coreIsOverdue(x));
  const unmatched=COR.list.filter(x=>x.status==='unmatched_return').sort((a,b)=>(b.returnedMs||0)-(a.returnedMs||0));
  const settled=COR.list.filter(x=>x.status==='returned'||x.status==='written_off').sort((a,b)=>(b.returnedMs||0)-(a.returnedMs||0));
  const owed=Math.round(open.reduce((a,x)=>a+(parseFloat(x.amount)||0),0)*100)/100;
  const row=(x)=>{
    const v=x.vehicleId?getV(x.vehicleId):null;const inv=INV.list.find(i=>i.id===x.invoiceId);
    const who=[x.orderedBy,v?`${vehName(v)} #${v.stockNumber||'—'}`:(x.vinHint?'VIN …'+x.vinHint:'')].filter(Boolean).join(' · ');
    const state=x.status==='open'?`<span style="font-size:11px;font-weight:700;color:${coreIsOverdue(x)?'#f87171':'#fbbf24'}">${coreDays(x)}d open</span>`
      :x.status==='returned'?`<span style="font-size:11px;color:#4ade80">Returned${x.returnedMs?' '+fmtD(x.returnedMs):''}${x.returnInvoiceId==='manual'?' (manual)':''}</span>`
      :x.status==='written_off'?`<span style="font-size:11px;color:#8a9ab0">Written off</span>`
      :`<span style="font-size:11px;color:#7cb4f5">Credit${x.returnedMs?' '+fmtD(x.returnedMs):''} · no open core matched</span>`;
    const actions=x.status==='open'?`<div style="display:flex;gap:4px"><button class="emp-btn" data-core="returned" data-id="${invEsc(x.id)}">Returned</button><button class="emp-btn" data-core="written_off" data-id="${invEsc(x.id)}" title="Give up on this core">Write off</button></div>`
      :x.status==='unmatched_return'?`<button class="emp-btn" data-core="returned" data-id="${invEsc(x.id)}" title="Acknowledge this credit">OK</button>`
      :`<button class="fl-link" data-core="open" data-id="${invEsc(x.id)}" style="color:#8a9ab0;font-size:11px">Undo</button>`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${invEsc(x.description||x.partNumber)}${x.quantity>1?` ×${x.quantity}`:''}</div>
      <div style="font-size:11px;color:#8a9ab0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${invEsc(x.vendorName||'')} #${invEsc(x.orderNumber||'')}${x.openedMs?' · '+fmtD(x.openedMs):''}${who?' · '+invEsc(who):''}</div>
      <div style="margin-top:3px">${state}${inv&&inv.receipt&&inv.receipt.url?` · <a href="${invEsc(inv.receipt.url)}" target="_blank" rel="noopener" style="font-size:11px;color:#7cb4f5">invoice</a>`:''}</div></div>
      <div style="font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;${x.status!=='open'?'color:#64758d':''}">${invMoney(x.amount)}</div>${actions}</div>`;
  };
  let html=`<div class="fl-receipt" style="border-style:solid;gap:0;padding:0;overflow:hidden">
    <div style="flex:1;padding:12px 14px;border-right:1px solid var(--border)"><div class="fl-head" style="margin:0 0 4px">Open cores</div><div style="font-size:24px;font-weight:800;color:${open.length?'#fbbf24':'#fff'};line-height:1.2">${open.length}</div><div style="font-size:11px;color:#8a9ab0">${invMoney(owed)} in deposits out</div></div>
    <div style="flex:1;padding:12px 14px"><div class="fl-head" style="margin:0 0 4px">Overdue</div><div style="font-size:24px;font-weight:800;color:${overdue.length?'#f87171':'#4ade80'};line-height:1.2">${overdue.length}</div><div style="font-size:11px;color:#8a9ab0">${CORE_OVERDUE_DAYS}+ days, no credit yet</div></div></div>
    <p style="margin:0 0 14px;font-size:12px;line-height:1.5;color:#8a9ab0">A core opens when an invoice charges one and closes by itself when the vendor's credit comes through. Mark one returned only if the credit never shows up in the import.</p>`;
  const section=(title,color,items)=>items.length?`<div class="panel"><div class="fl-head" style="color:${color}">${title} · ${items.length}</div>${items.map(row).join('')}</div>`:'';
  html+=section('⚠ Overdue — chase these','#f87171',overdue);
  html+=section('Open','#fbbf24',fresh);
  html+=section('Credits with no matching core','#7cb4f5',unmatched);
  html+=`<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#8a9ab0;cursor:pointer;margin:4px 0 10px"><input type="checkbox" id="cor-settled" ${COR.showSettled?'checked':''}> Show returned / written off (${settled.length})</label>`;
  if(COR.showSettled) html+=section('Settled','#8a9ab0',settled);
  if(!COR.list.length) html+=`<div class="empty"><div class="empty-icon">🔋</div><div class="empty-msg">No cores yet</div><div class="empty-sub">They appear as Advance and WorldPac invoices are imported.</div></div>`;
  c.innerHTML=html;
  c.querySelector('#cor-settled').onchange=e=>{COR.showSettled=e.target.checked;render();};
  c.querySelectorAll('[data-core]').forEach(b=>b.onclick=()=>{const st=b.getAttribute('data-core');const id=b.getAttribute('data-id');
    if(st==='written_off'){const n=prompt('Write off this core — why? (optional)');if(n===null)return;settleCore(id,'written_off',n||'');}
    else if(st==='returned'){if(confirm('Mark this core as returned / credited?'))settleCore(id,'returned');}
    else settleCore(id,'open');});
}

    if(SETTINGS.mechanics.length<=1){toast('Need at least 1 mechanic','err');return;}
    if(!confirm('Remove this mechanic? Vehicles assigned to them will become unassigned.'))return;
    SETTINGS.mechanics=SETTINGS.mechanics.filter(m=>m.id!==mechId);
    // Unassign vehicles
    ST.vehicles.forEach(v=>{if(v.assignedTo===mechId)v.assignedTo='';if(v.assignedTo2===mechId)v.assignedTo2='';});
    save();saveSettings();
    c.innerHTML=settingsHTML();
    // Re-wire events
    renderSettings(c);
    toast('Mechanic removed');

    const newId='mech'+Date.now();
    const colors=['#8b5cf6','#f59e0b','#06b6d4','#ec4899','#10b981','#3b82f6'];
    const icons=['🔨','⚙️','🛠','🔑','🪛','🔩'];

// STORAGE MIGRATION — one-tap move from Firestore to Firebase Storage
// ═══════════════════════════════════════════════
function updateStorageMigrationStats(){
  const el=document.getElementById('storage-migration-stats');
  if(!el) return;
  let legacyPhotos=0, migratedPhotos=0, legacyReceipts=0, migratedReceipts=0;
  for(const v of ST.vehicles){
    const visits=(v.visits&&v.visits.length)?v.visits:[v];
    for(const vi of visits){
      if(!vi||typeof vi!=='object') continue;
      for(const p of (vi.photos||[])){
        if(typeof p==='string') legacyPhotos++;
        else if(p&&p.url) migratedPhotos++;
        else if(p&&p.data) legacyPhotos++;
      }
      for(const r of (vi.receipts||[])){
        if(typeof r==='string') legacyReceipts++;
        else if(r&&r.url) migratedReceipts++;
        else if(r&&r.data) legacyReceipts++;
      }
    }
  }
  const totalLegacy=legacyPhotos+legacyReceipts;
  el.innerHTML=`Photos: <span style="color:#fbbf24">${legacyPhotos} legacy</span> · <span style="color:#6ee7b7">${migratedPhotos} in Storage</span><br>Receipts: <span style="color:#fbbf24">${legacyReceipts} legacy</span> · <span style="color:#6ee7b7">${migratedReceipts} in Storage</span>`;
  const btn=document.getElementById('btn-migrate-storage');
  if(btn){
    if(totalLegacy===0){
      btn.disabled=true;
      btn.style.opacity='0.5';
      btn.style.cursor='not-allowed';
      btn.textContent='✅ All files already in Storage';
    }
  }
}

async function startStorageMigration(){
  if(!storage){
    toast('Firebase Storage not available','err');
    return;
  }
  const btn=document.getElementById('btn-migrate-storage');
  const log=document.getElementById('storage-migration-progress');
  if(!btn||!log) return;

  btn.disabled=true;
  btn.style.opacity='0.5';
  btn.style.cursor='not-allowed';
  btn.textContent='Migrating…';
  log.style.display='block';
  log.innerHTML='';

  const logLine=(msg,color)=>{
    const line=document.createElement('div');
    if(color) line.style.color=color;
    line.textContent=msg;
    log.appendChild(line);
    log.scrollTop=log.scrollHeight;
  };

  const shopId='automotive_connection';
  let photosMigrated=0, photosFailed=0;
  let receiptsMigrated=0, receiptsFailed=0;
  let vehiclesTouched=0;

  logLine('═══ Storage migration starting ═══','#6ee7b7');
  logLine(`${ST.vehicles.length} vehicles to scan`);

  for(const v of ST.vehicles){
    let vehicleChanged=false;
    const visits=(v.visits&&v.visits.length)?v.visits:[];
    // Build a list of targets: top-level + every visit
    const targets=[{obj:v,label:'(top-level)'}];
    for(let j=0;j<visits.length;j++){
      targets.push({obj:visits[j],label:`visit #${j+1}`});
    }

    for(const t of targets){
      const holder=t.obj;
      if(!holder||typeof holder!=='object') continue;

      // PHOTOS
      if(Array.isArray(holder.photos)){
        for(let i=0;i<holder.photos.length;i++){
          const p=holder.photos[i];
          if(p&&typeof p==='object'&&p.url) continue;
          let dataUrl=null;
          if(typeof p==='string') dataUrl=p;
          else if(p&&typeof p==='object'&&p.data) dataUrl=p.data;
          if(!dataUrl||!dataUrl.startsWith('data:')){continue;}
          try {
            const blob=dataUrlToBlob(dataUrl);
            const ext=extFromMime(blob.type);
            const path=`shops/${shopId}/vehicles/${v.id}/photos/${uid()}.${ext}`;
            const obj=await uploadToStorage(blob,path);
            holder.photos[i]=obj;
            photosMigrated++;
            vehicleChanged=true;
            logLine(`✅ ${v.stockNumber||'?'} photo ${i+1} ${t.label} → ${Math.round(blob.size/1024)} KB`,'#6ee7b7');
          } catch(e) {
            photosFailed++;
            logLine(`❌ ${v.stockNumber||'?'} photo ${i+1} ${t.label}: ${e.message}`,'#fca5a5');
          }
        }
      }

      // RECEIPTS
      if(Array.isArray(holder.receipts)){
        for(let i=0;i<holder.receipts.length;i++){
          const r=holder.receipts[i];
          if(r&&typeof r==='object'&&r.url) continue;
          let dataUrl=null, name='receipt';
          if(typeof r==='string'){dataUrl=r;name='receipt.jpg';}
          else if(r&&typeof r==='object'){
            dataUrl=r.data;
            name=r.name||'receipt';
          }
          if(!dataUrl||!dataUrl.startsWith('data:')){continue;}
          try {
            const blob=dataUrlToBlob(dataUrl);
            const ext=extFromMime(blob.type);
            const path=`shops/${shopId}/vehicles/${v.id}/receipts/${uid()}.${ext}`;
            const obj=await uploadToStorage(blob,path);
            holder.receipts[i]={...obj,name,date:(r&&r.date)||Date.now()};
            receiptsMigrated++;
            vehicleChanged=true;
            logLine(`✅ ${v.stockNumber||'?'} receipt ${i+1} (${name}) ${t.label} → ${Math.round(blob.size/1024)} KB`,'#6ee7b7');
          } catch(e) {
            receiptsFailed++;
            logLine(`❌ ${v.stockNumber||'?'} receipt ${i+1} ${t.label}: ${e.message}`,'#fca5a5');
          }
        }
      }
    }

    if(vehicleChanged){
      vehiclesTouched++;
      try {
        save();
      } catch(e) {
        logLine(`⚠ Save failed for ${v.stockNumber}: ${e.message}`,'#fbbf24');
      }
    }
  }

  logLine('','');
  logLine('═══ Migration complete ═══','#6ee7b7');
  logLine(`Photos: ${photosMigrated} migrated, ${photosFailed} failed`);
  logLine(`Receipts: ${receiptsMigrated} migrated, ${receiptsFailed} failed`);
  logLine(`Vehicles updated: ${vehiclesTouched}`);

  if(photosMigrated+receiptsMigrated>0){

  } else if(photosFailed+receiptsFailed===0){

  }

  btn.disabled=false;
  btn.style.opacity='1';
  btn.style.cursor='pointer';
  btn.textContent='🚀 Migrate photos & receipts to Storage';
  updateStorageMigrationStats();
}

// Delete an individual visit from its owning vehicle (History tab action)
// Gated by Master PIN (defensive — button only shows when unlocked anyway)
// Refuses to delete the last remaining visit on a vehicle.
window.deleteVisitById = function(visitId){
  if(!ST.masterPinUnlocked){
    toast('Unlock with Master PIN first','err');
    return;
  }
  // Find the owning vehicle
  const vehicle = ST.vehicles.find(v => (v.visits||[]).some(vi => vi.id === visitId));
  if(!vehicle){
    toast('Visit not found','err');
    return;
  }
  if((vehicle.visits||[]).length <= 1){
    alert('Cannot delete the last remaining visit. Delete the whole vehicle instead from the header.');
    return;
  }
  const visit = vehicle.visits.find(vi => vi.id === visitId);
  const visitIdx = vehicle.visits.findIndex(vi => vi.id === visitId) + 1;
  const stock = visit.stockNumber || vehicle.stockNumber || '—';
  const partsCount = (visit.parts||[]).length;
  const laborCount = (visit.laborLines||[]).length;
  const photoCount = (visit.photos||[]).length;
  const receiptCount = (visit.receipts||[]).length;
  const summary = 'This will permanently delete:\n'
    + '  • Visit #' + visitIdx + ' (Stock #' + stock + ')\n'
    + '  • ' + partsCount + ' parts entries\n'
    + '  • ' + laborCount + ' labor lines\n'
    + '  • ' + photoCount + ' photos (linked)\n'
    + '  • ' + receiptCount + ' receipts (linked)\n'
    + '\nContinue?';
  if(!confirm(summary)) return;

  // Remove the visit from the vehicle
  vehicle.visits = vehicle.visits.filter(vi => vi.id !== visitId);
  // Refresh top-level shim so the UI reads the next-current visit
  applyVisitShim(vehicle);
  vehicle.updatedAt = Date.now();
  save();
  toast('Visit deleted');
  render();
};

// ═══════════════════════════════════════════════════
// PER-VEHICLE CLOUD SYNC
// Each vehicle is its own Firestore doc: shops/automotive_connection/vehicles/{id}
// ═══════════════════════════════════════════════════
let lastPushedJson = new Map();  // vehicle id -> json we last wrote/accepted from cloud

async function saveToFirestore(vehicles) {
  if(!db){setSyncStatus('err');return;}
  setSyncStatus('syncing');
  saveInFlight++;
  try {
    const colRef = db.collection('shops').doc('automotive_connection').collection('vehicles');
    const currentIds = new Set();
    const changed = [];
    for(const v of (vehicles||[])){
      if(!v || !v.id) continue;
      currentIds.add(v.id);
      const json = JSON.stringify(v);
      if(json.length/1024 > 900){
        // One single vehicle over 900KB — extremely unlikely with files in Storage
        console.warn('Vehicle too large to sync:', v.id, Math.round(json.length/1024)+'KB');
        toast(`⚠ ${v.stockNumber||'A vehicle'} is too large to sync`, 'err');
        continue;
      }
      if(lastPushedJson.get(v.id) !== json) changed.push({id:v.id, json});
    }
    // v26.9: only vehicles explicitly deleted by a user are removed from the cloud.
    const missing = [...lastPushedJson.keys()].filter(id=>!currentIds.has(id));
    const removed = missing.filter(id=>explicitDeleteIds.has(id));
    const unexplained = missing.filter(id=>!explicitDeleteIds.has(id));
    if(unexplained.length){
      // Vehicles vanished locally without a user delete — refuse to touch them in
      // the cloud; forget our copy so the next snapshot re-adopts the cloud version.
      console.error('SAFETY: '+unexplained.length+' vehicle(s) missing locally without explicit delete — NOT deleting from cloud:', unexplained.slice(0,10));
      unexplained.forEach(id=>lastPushedJson.delete(id));
    }
    if(removed.length > MAX_SILENT_REMOVALS){
      console.error('SAFETY: refusing to delete '+removed.length+' vehicles in one save (limit '+MAX_SILENT_REMOVALS+')');
      toast('⚠ Blocked a bulk delete of '+removed.length+' vehicles — reload and retry one at a time','err');
      removed.length = 0;
    }

    if(!changed.length && !removed.length){
      clearPendingIds(); _syncFailReason=null; updateSyncBanner(); setSyncStatus('ok');
      return;
    }

    // Firestore batches max out at 500 ops — chunk if ever needed
    const ops = [...changed.map(c=>({t:'set',...c})), ...removed.map(id=>({t:'del',id}))];
    for(let i=0;i<ops.length;i+=400){
      const batch = db.batch();
      ops.slice(i,i+400).forEach(op=>{
        if(op.t==='set') batch.set(colRef.doc(op.id), {json:op.json, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        else batch.delete(colRef.doc(op.id));
      });
      await batch.commit();
    }
    changed.forEach(c=>lastPushedJson.set(c.id, c.json));
    removed.forEach(id=>{ lastPushedJson.delete(id); explicitDeleteIds.delete(id); });
    if(removed.length) persistExplicitDeletes();

    clearPendingIds(); _syncFailReason=null; updateSyncBanner(); setSyncStatus('ok');
    console.log(`Firestore save OK ✅ (${changed.length} vehicle${changed.length!==1?'s':''} updated${removed.length?', '+removed.length+' removed':''})`);
  } catch(e) {
    setSyncStatus('err');
    console.error('Firestore save failed:', e);
    window._lastSyncError = 'SAVE: ' + (e&&e.code?e.code+' — ':'') + (e&&e.message?e.message:String(e));
    setPendingIds((vehicles||[]).map(v=>v.id));
    _syncFailReason = (e && e.code==='permission-denied') ? 'permission' : 'error';
    updateSyncBanner();
  } finally {
    saveInFlight--;
  }
}

// One-time cloud migration: single legacy doc → per-vehicle docs.
// Merges legacy cloud data with local (newer updatedAt wins, local wins ties
// and pending-unsynced), writes every vehicle as its own doc, leaves the old
// doc in place as a backup.
async function ensurePerVehicleCloud(){
  if(!db) return;
  const shopRef = db.collection('shops').doc('automotive_connection');
  try{
    const probe = await shopRef.collection('vehicles').limit(1).get();
    if(!probe.empty) return; // already on per-vehicle docs

    let legacyVs = [];
    try{
      const legacy = await shopRef.get();
      if(legacy.exists && legacy.data().vehicles) legacyVs = JSON.parse(legacy.data().vehicles);
    }catch(e){ console.warn('Legacy doc read failed:', e); }

    // Merge legacy cloud with local — same rules as live merge
    const localById = new Map((ST.vehicles||[]).filter(v=>v&&v.id).map(v=>[v.id,v]));
    const merged = []; const seen = new Set();
    legacyVs.forEach(cv=>{
      if(!cv||!cv.id) return; seen.add(cv.id);
      const lv = localById.get(cv.id);
      if(!lv){ merged.push(cv); return; }
      if(pendingUnsyncedIds.has(cv.id)){ merged.push(lv); return; }
      merged.push(((lv.updatedAt||0) >= (cv.updatedAt||0)) ? lv : cv);
    });
    localById.forEach((lv,id)=>{ if(!seen.has(id)) merged.push(lv); });

    if(!merged.length) return; // nothing to migrate (fresh install)

    ST.vehicles = merged;
    migrateVehiclesToVisits();
    applyVisitShimAll();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(ST.vehicles)); }catch(e){}

    for(let i=0;i<merged.length;i+=400){
      const batch = db.batch();
      merged.slice(i,i+400).forEach(v=>{
        if(!v||!v.id) return;
        const json = JSON.stringify(v);
        if(json.length/1024 > 900) return;
        batch.set(shopRef.collection('vehicles').doc(v.id), {json, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        lastPushedJson.set(v.id, json);
      });
      await batch.commit();
    }
    console.log('☁️ Cloud upgraded to per-vehicle docs:', merged.length, 'vehicles');
    clearPendingIds(); _syncFailReason=null; updateSyncBanner();
    toast('✓ Cloud storage upgraded — size limit removed');
  }catch(e){
    console.error('Per-vehicle cloud migration failed:', e);
    window._lastSyncError = 'MIGRATION: ' + (e&&e.code?e.code+' — ':'') + (e&&e.message?e.message:String(e));
  }
}

// ─── PERSISTENT SYNC-FAILURE BANNER ───
// Transient toasts are easy to miss; while sync is failing we pin a red banner
// to the top of the app so nobody keeps working thinking data is safe.
let _syncFailReason=null; // 'oversize' | 'error' | null
function updateSyncBanner(){
  let b=document.getElementById('sync-fail-banner');
  const failing=_syncFailReason!==null || pendingUnsyncedIds.size>0;
  if(!failing){ if(b) b.remove(); return; }
  const msg=_syncFailReason==='oversize'
    ? '⚠ A VEHICLE RECORD IS TOO LARGE TO SYNC — tap the sync dot for details.'
    : _syncFailReason==='permission'
    ? '⚠ CLOUD PERMISSION DENIED — Firestore security rules are blocking writes. Tell your developer.'
    : '⚠ CLOUD SYNC FAILING — changes are saving to THIS DEVICE ONLY. Tap here to retry.';
  if(!b){
    b=document.createElement('div');
    b.id='sync-fail-banner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fecaca;font-size:12px;font-weight:700;padding:8px 40px 8px 12px;text-align:center;border-bottom:2px solid #ef4444;line-height:1.4;cursor:pointer';
    b.onclick=()=>{
      if(_syncFailReason==='oversize'){ ST.view='settings'; render(); return; }
      // Any other failure: tap = retry sync now, then surface the error
      toast('Retrying cloud sync…');
      if(typeof saveToFirestore==='function' && ST.vehicles){
        saveToFirestore(ST.vehicles).then(()=>{
          setTimeout(()=>{ if(pendingUnsyncedIds.size>0 && window._lastSyncError){ alert('Sync still failing.\n\n'+window._lastSyncError); } },800);
        });
      }
    };
    document.body.appendChild(b);
  }
  b.innerHTML=msg + (window._lastSyncError?`<div style="font-weight:400;font-size:11px;color:#fca5a5;margin-top:3px;font-family:monospace;word-break:break-all">${String(window._lastSyncError).replace(/</g,'&lt;')}</div>`:'');
}

// Subscribe to real-time updates from Firestore (per-vehicle collection)
function subscribeToFirestore() {
  if(!db) return;
  if(unsubscribeFirestore) unsubscribeFirestore();
  setSyncStatus('syncing');
  unsubscribeFirestore = db.collection('shops').doc('automotive_connection').collection('vehicles')
    .onSnapshot(snap => {
      setSyncStatus('ok');
      try {
        const incoming = [];
        const cloudJsonById = new Map();
        snap.docs.forEach(d => {
          try{
            const j = d.data().json;
            if(!j) return;
            const v = JSON.parse(j);
            if(v && v.id){ incoming.push(v); cloudJsonById.set(v.id, j); }
          }catch(e){}
        });
        if(!snap.docs.length){
          console.log('Firestore: vehicle collection empty');
          return;
        }
        const prev = ST.vehicles || [];
        const fromCache = !!(snap.metadata && snap.metadata.fromCache);

        // v26.9 SAFETY: decide up front whether this snapshot may remove anything.
        // A cache-only snapshot, or one that would drop many vehicles at once,
        // is treated as partial: local vehicles are kept, nothing is pruned.
        const localIdsNow = new Set(prev.filter(v=>v&&v.id).map(v=>v.id));
        const wouldDrop = [...localIdsNow].filter(id=>!cloudJsonById.has(id) && lastPushedJson.has(id) && !pendingUnsyncedIds.has(id));
        let allowPrune = !fromCache && wouldDrop.length <= MAX_SILENT_REMOVALS;
        if(wouldDrop.length && !allowPrune){
          console.error('SAFETY: snapshot ('+(fromCache?'from cache':'server')+', '+snap.docs.length+' docs) would remove '+wouldDrop.length+' local vehicles — ignoring removals');
          window._lastSyncError='GUARD: blocked removal of '+wouldDrop.length+' vehicles from a '+(fromCache?'cached':'partial')+' snapshot at '+new Date().toLocaleTimeString();
        }

        // PROTECTION: per-vehicle newest-updatedAt merge (local wins ties and
        // pending-unsynced) — prevents snapshot echoes from wiping fresh edits.
        const localById = new Map(prev.filter(v=>v&&v.id).map(v=>[v.id, v]));
        const allIds = new Set([...localById.keys(), ...cloudJsonById.keys()]);
        const merged = [];
        allIds.forEach(id => {
          const localV = localById.get(id);
          const cloudV = incoming.find(v=>v.id===id);
          if(!cloudV){
            // Local-only. If cloud previously knew it (lastPushedJson) it was
            // deleted on another device — drop it unless pending here.
            if(allowPrune && lastPushedJson.has(id) && !pendingUnsyncedIds.has(id)) return;
            if(!allowPrune) lastPushedJson.delete(id); // keep it; let a later save re-push it
            merged.push(localV);
            return;
          }
          if(!localV){ merged.push(cloudV); lastPushedJson.set(id, cloudJsonById.get(id)); return; }
          if(pendingUnsyncedIds.has(id)){ merged.push(localV); return; }
          const localT = localV.updatedAt || 0;
          const cloudT = cloudV.updatedAt || 0;
          if(localT > cloudT){
            merged.push(localV); // local newer — will be pushed by flush below
          } else if(localT < cloudT){
            merged.push(cloudV); lastPushedJson.set(id, cloudJsonById.get(id));
          } else {
            merged.push(localV); lastPushedJson.set(id, cloudJsonById.get(id));
          }
        });

        ST.vehicles = merged;
        migrateVehiclesToVisits();
        applyVisitShimAll();

        const mergedJson = JSON.stringify(ST.vehicles);
        const prevJson = JSON.stringify(prev);

        if(mergedJson !== prevJson){
          try { localStorage.setItem(STORAGE_KEY, mergedJson); } catch(e) {}
          if(document.getElementById('app')?.style.display !== 'none'){
            render();
          }
          if(saveInFlight === 0){
            saveToFirestore(ST.vehicles); // diff-based: only pushes what differs
          }
        } else {
          ST.vehicles = prev;
        }

        // STALE-FLAG RECOVERY: attempt a flush while unsynced flag is set;
        // a successful (even empty-diff) save clears the flag + red banner.
        if(pendingUnsyncedIds.size > 0 && saveInFlight === 0){
          console.log('Pending unsynced changes detected — attempting sync flush');
          saveToFirestore(ST.vehicles);
        }
      } catch(e) {
        console.warn('Firestore parse error:', e);
      }
    }, err => {
      setSyncStatus('err');
      console.error('Firestore subscription error:', err);
      window._lastSyncError = 'SUBSCRIBE: ' + (err&&err.code?err.code+' — ':'') + (err&&err.message?err.message:String(err));
      updateSyncBanner();
    });
}
