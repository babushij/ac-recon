        ${delBtn}
      </div>`;
    }).join('');
    obdPanel.innerHTML=`
      <div class="panel-title" style="display:flex;align-items:center;gap:8px"><span>📋</span> OBDII scan reports</div>
      <div style="font-size:12px;color:#cdd3de;margin-bottom:12px">Diagnostic scan PDFs · stored on this vehicle, not parsed by AI</div>
      <div id="obd-scan-zone" style="border:1.5px dashed #2a2f3f;border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:border-color .15s"
        onclick="document.getElementById('obd-file-input').click()"
        ondragover="event.preventDefault();this.style.borderColor='#06b6d4'"
        ondragleave="this.style.borderColor='#2a2f3f'"
        ondrop="event.preventDefault();this.style.borderColor='#2a2f3f';window.handleObdScanDrop(event)">
        <div style="font-size:26px;margin-bottom:5px">📋</div>
        <div style="font-size:13px;color:#cdd3de">Tap to upload OBDII scan PDF</div>
      </div>
      <input id="obd-file-input" type="file" accept="application/pdf" style="display:none" onchange="window.processObdScanFile(this)">
      <div id="obd-scan-status" style="margin-top:10px;font-size:13px;color:#cdd3de;text-align:center;min-height:18px"></div>
      <div id="obd-scan-list" style="margin-top:8px">${obdRows}</div>`;
    wrapper.appendChild(obdPanel);

    // OBDII upload handlers (fresh closure each time tab builds, captures v + addObdScan)
    window.handleObdScanDrop=function(e){
      const f=e.dataTransfer?.files?.[0];
      if(f) window.processObdScanFileObj(f);
    };
    window.processObdScanFile=function(input){
      if(input.files[0]) window.processObdScanFileObj(input.files[0]);
      input.value='';
    };
    window.processObdScanFileObj=async function(file){
      const st=document.getElementById('obd-scan-status');
      if(!st) return;
      const fileName = file.name || 'obd-scan.pdf';
      const isPdf = file.type === 'application/pdf' || fileName.toLowerCase().endsWith('.pdf');
      if(!isPdf){st.textContent='Only PDF files supported for OBDII scans.';st.style.color='#f87171';return;}
      st.textContent='Uploading...';st.style.color='#f59e0b';
      try {
        let entry;
        if(typeof storage !== 'undefined' && storage){
          try {
            const path = `shops/automotive_connection/vehicles/${v.id}/obd/${uid()}.pdf`;
            const obj = await uploadToStorage(file, path);
            entry = {...obj, name:fileName, date:Date.now()};
          } catch(upErr){
            console.warn('OBD upload to storage failed, using inline:', upErr);
            const dataUrl = await blobToDataUrl(file);
            entry = {name:fileName, data:dataUrl, date:Date.now()};
          }
        } else {
          const dataUrl = await blobToDataUrl(file);
          entry = {name:fileName, data:dataUrl, date:Date.now()};
        }
        addObdScan(entry);
        st.textContent='OBDII scan saved ✓';st.style.color='#34d399';
        toast('OBDII scan saved');
        setTimeout(()=>{ if(typeof refreshDetail==='function') refreshDetail(); }, 100);
      } catch(e){
        console.error('OBD upload error:', e);
        st.textContent='Upload failed: '+e.message;
        st.style.color='#f87171';
      }
    };
    window.delObdScan=delObdScan;

    // ── PARTS SECTION (pipeline: needed → ordered → received) ──
    const allParts = v.parts || [];
    const partsTotal = allParts.reduce((a,p)=>a+((parseFloat(p.cost)||0)*(parseInt(p.qty)||1)),0);
    const receivedTotal = allParts.filter(p=>partState(p)==='received'||partState(p)==='installed').reduce((a,p)=>a+((parseFloat(p.cost)||0)*(parseInt(p.qty)||1)),0);
    const pendingTotal = allParts.filter(p=>partState(p)==='needed'||partState(p)==='ordered').reduce((a,p)=>a+((parseFloat(p.cost)||0)*(parseInt(p.qty)||1)),0);
    const partsPanel=document.createElement('div');partsPanel.className='panel';
    const partsVendors=getVendors('parts');

    // Render a single part row, varying the layout/badges by state
    const renderPartRow = (p, i)=>{
      const state = partState(p);
      const vName = p.vendor ? (getVendorById(p.vendor)?.name || '') : '';
      const lineCost = (parseFloat(p.cost)||0) * (parseInt(p.qty)||1);
      // Badge
      let badge = '';
      if(state === 'needed'){
        badge = `<span style="display:inline-block;background:#7c2d12;color:#fed7aa;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase">📋 Needed</span>`;
      } else if(state === 'ordered'){
        const etaStr = p.eta ? new Date(p.eta).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
        const etaLabel = etaStr ? `ETA ${etaStr}` : 'ETA —';
        badge = `<span style="display:inline-block;background:#1e3a8a;color:#bfdbfe;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase">🚚 Ordered · ${etaLabel}</span>`;
      } else if(state === 'installed'){
        badge = `<span style="display:inline-block;background:#4c1d95;color:#ddd6fe;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase">🔧 Installed${p.installedDate?' · '+new Date(p.installedDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</span>`;
      } else {
        badge = `<span style="display:inline-block;background:#14532d;color:#bbf7d0;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase">${p.deliveredVia==='email'?'📦 Delivered':'✓ Received'}${p.deliveredVia==='email'&&p.deliveredDate?' · '+new Date(p.deliveredDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</span>`;
      }
      // Action buttons by state
      let actionBtns = '';
      if(state === 'needed'){
        actionBtns = `<button class="ppl-btn ppl-order" data-i="${i}" title="Mark as ordered">🚚 Order this</button>
          <button class="ppl-btn ppl-receive" data-i="${i}" title="Mark as received">📦 Mark received</button>`;
      } else if(state === 'ordered'){
        actionBtns = `<button class="ppl-btn ppl-receive" data-i="${i}" title="Mark as received">📦 Mark received</button>
          <button class="ppl-btn ppl-edit-order" data-i="${i}" title="Edit order details">✎ Edit ETA / Tracking</button>`;
      } else if(state === 'received'){
        actionBtns = `<button class="ppl-btn ppl-install" data-i="${i}" title="Mark as installed on the car">🔧 Mark installed</button>
          <button class="ppl-btn ppl-stock" data-i="${i}" title="Not going on this car — keep as inventory">📦 Not for this car</button>`;
      } else if(state === 'installed'){
        actionBtns = `<button class="ppl-btn ppl-uninstall" data-i="${i}" title="Back to received">↩ Not installed</button>`;
      }
      // Tracking line for ordered
      const trackingLine = (state==='ordered' && p.trackingNum)
        ? `<div style="font-size:10px;color:#cdd3de;margin-top:2px"><span style="color:#9aa3b8">Tracking:</span> <a href="#" onclick="window.openTrackingSearch('${(p.trackingNum||'').replace(/'/g,'')}');return false;" style="color:#60a5fa;text-decoration:none">${p.trackingNum}</a></div>`
        : '';
      const noteLine = p.note
        ? `<div style="font-size:10px;color:#fbbf24;margin-top:2px;font-style:italic">📝 ${p.note}</div>`
        : '';
      return `
      <div class="part-row" data-state="${state}" style="padding:9px 0;border-bottom:1px solid #1e2230">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
              ${badge}
            </div>
            <div style="font-size:13px;color:#e2e4ea">${p.name}</div>
            <div style="font-size:10px;color:#9aa3b8">${p.partNum?`#${p.partNum}`:''}${p.partNum&&vName?' · ':''}${vName?`<span style="color:#818cf8">${vName}</span>`:''}</div>
            ${trackingLine}
            ${noteLine}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
            <span style="font-size:13px;font-weight:600;color:#C8102E">${fmt$(lineCost)}</span>
            <span style="font-size:10px;color:#9aa3b8">×${p.qty||1}</span>
          </div>
          <button class="del-btn" onclick="deletePart(${i})" style="align-self:flex-start">✕</button>
        </div>
        ${actionBtns ? `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${actionBtns}</div>` : ''}
      </div>`;
    };

    // Group rows by state, preserving original index for action handlers
    const groupedRows = {needed: [], ordered: [], received: [], installed: []};
    allParts.forEach((p, i)=>{
      const s = partState(p);
      groupedRows[s] = groupedRows[s] || [];
      groupedRows[s].push(renderPartRow(p, i));
    });

    let partsListHtml = '';
    if(groupedRows.needed.length){
      partsListHtml += `<div style="font-size:10px;color:#fed7aa;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:6px 0 2px">📋 Needed (${groupedRows.needed.length})</div>`;
      partsListHtml += groupedRows.needed.join('');
    }
    if(groupedRows.ordered.length){
      partsListHtml += `<div style="font-size:10px;color:#bfdbfe;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 0 2px">🚚 Ordered (${groupedRows.ordered.length})</div>`;
      partsListHtml += groupedRows.ordered.join('');
    }
    if(groupedRows.received.length){
      partsListHtml += `<div style="font-size:10px;color:#bbf7d0;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 0 2px">✓ Received (${groupedRows.received.length})</div>`;
      partsListHtml += groupedRows.received.join('');
    }
    if(groupedRows.installed.length){
      partsListHtml += `<div style="font-size:10px;color:#ddd6fe;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 0 2px">🔧 Installed (${groupedRows.installed.length})</div>`;
      partsListHtml += groupedRows.installed.join('');
    }
    if(!partsListHtml){
      partsListHtml = '<div style="color:#7a8499;font-size:13px;padding:12px 0;text-align:center">No parts yet — scan a receipt or add below</div>';
    }

    const partsVendorOptions = partsVendors.length
      ? `<option value="">— No vendor —</option>` + partsVendors.map(vn=>`<option value="${vn.id}">${vn.name}</option>`).join('')
      : `<option value="">No parts vendors yet — add in Vendors</option>`;

    // Pending parts banner
    const pendingBanner = pendingTotal > 0
      ? `<div style="background:#1e3a8a33;border:1px solid #1e3a8a;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#bfdbfe;display:flex;align-items:center;gap:8px"><span style="font-size:16px">⏳</span><span><strong>${groupedRows.needed.length+groupedRows.ordered.length} part${(groupedRows.needed.length+groupedRows.ordered.length)!==1?'s':''} pending</strong> · ${fmt$(pendingTotal)} not yet received</span></div>`
      : '';

    const toInstallBanner = groupedRows.received.length
      ? `<div id="to-install-banner" style="background:#4c1d9533;border:1px solid #4c1d95;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#ddd6fe;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:16px">🔧</span><span style="flex:1"><strong>${groupedRows.received.length} part${groupedRows.received.length!==1?'s':''} to install</strong> · tap Mark installed when it is on the car</span><button class="ppl-btn" id="inst-all-veh">Mark all installed</button></div>`
      : '';
    partsPanel.innerHTML=`
      <div class="panel-title">Parts & Materials <span style="float:right;color:#C8102E">${fmt$(partsTotal)}</span></div>
      ${pendingBanner}
      ${toInstallBanner}
      <div id="parts-list">${partsListHtml}</div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="field" style="grid-column:1/-1"><label>Part name *</label><input id="p-name" placeholder="e.g. Front brake pads"></div>
        <div class="field"><label>Part # (optional)</label><input id="p-num" placeholder="e.g. D1060"></div>
        <div class="field"><label>Vendor (optional)</label><select id="p-vendor" style="width:100%;background:#111318;border:1px solid #2a2f3f;color:#e2e4ea;padding:9px 10px;border-radius:8px;font-size:13px">${partsVendorOptions}</select></div>
        <div class="field"><label>Unit cost *</label><input id="p-cost" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="field"><label>Qty</label><input id="p-qty" type="number" min="1" value="1"></div>
        <div class="field" style="grid-column:1/-1"><label>State</label>
          <select id="p-state" style="width:100%;background:#111318;border:1px solid #2a2f3f;color:#e2e4ea;padding:9px 10px;border-radius:8px;font-size:13px">
            <option value="received" selected>✓ Received (have it now)</option>
            <option value="ordered">🚚 Ordered (on the way)</option>
            <option value="needed">📋 Needed (not yet ordered)</option>
            <option value="installed">🔧 Installed (already on the car)</option>
          </select>
        </div>
      </div>
      <button class="btn-red" style="padding:10px 18px;border-radius:8px;font-size:13px;margin-top:8px" onclick="addPart()">+ Add part</button>`;
    wrapper.appendChild(partsPanel);

    // Wire pipeline action buttons (delegated)
    setTimeout(()=>{
      partsPanel.querySelectorAll('.ppl-order').forEach(btn=>{
        btn.onclick=()=>window.openOrderDialog(parseInt(btn.dataset.i));
      });
      partsPanel.querySelectorAll('.ppl-edit-order').forEach(btn=>{
        btn.onclick=()=>window.openOrderDialog(parseInt(btn.dataset.i));
      });
      partsPanel.querySelectorAll('.ppl-receive').forEach(btn=>{
        btn.onclick=()=>window.markPartReceived(parseInt(btn.dataset.i));
      });
      partsPanel.querySelectorAll('.ppl-install').forEach(btn=>{
        btn.onclick=()=>window.markPartInstalled(parseInt(btn.dataset.i),true);
      });
      partsPanel.querySelectorAll('.ppl-stock').forEach(btn=>{
        btn.onclick=()=>{ partToStock(v.id,parseInt(btn.dataset.i)); toast('Moved to loose inventory'); render(); };
      });
      const _ia=partsPanel.querySelector('#inst-all-veh');
      if(_ia) _ia.onclick=()=>{ const n=installAllReceived(v.id); toast(n+' parts marked installed'); render(); };
      partsPanel.querySelectorAll('.ppl-uninstall').forEach(btn=>{
        btn.onclick=()=>window.markPartInstalled(parseInt(btn.dataset.i),false);
      });
    }, 0);

    // ── LABOR SECTION ──
    const mechRate=getMMAP()[v.assignedTo]?.laborRate||65;
    const laborTotal=(v.laborLines||[]).reduce((a,l)=>a+((parseFloat(l.hours)||0)*(parseFloat(l.rate)||0)),0);
    const laborPanel=document.createElement('div');laborPanel.className='panel';
    const subletVendors=getVendors('sublet');
    const laborRows=(v.laborLines||[]).map((l,i)=>{
      const vName = l.vendor ? (getVendorById(l.vendor)?.name || '') : '';
      return `
      <div style="display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid #1e2230">
        <div style="min-width:0">
          <div style="font-size:13px;color:#e2e4ea">${l.desc}</div>
          ${vName?`<div style="font-size:10px;color:#f97316">↗ ${vName}</div>`:''}
        </div>
        <span style="font-size:11px;color:#9aa3b8;white-space:nowrap">${l.hours}h @ $${parseFloat(l.rate||0).toFixed(0)}/hr</span>
        <span style="font-size:13px;font-weight:600;color:#C8102E">${fmt$((parseFloat(l.hours)||0)*(parseFloat(l.rate)||0))}</span>
        <button class="del-btn" onclick="deleteLaborLine(${i})">✕</button>
      </div>`;
    }).join('');
    const subletVendorOptions = subletVendors.length
      ? `<option value="">— In-house —</option>` + subletVendors.map(vn=>`<option value="${vn.id}">${vn.name}</option>`).join('')
      : `<option value="">No sublet shops yet — add in Vendors</option>`;
    laborPanel.innerHTML=`
      <div class="panel-title">Labor <span style="float:right;color:#C8102E">${fmt$(laborTotal)}</span></div>
      <div id="labor-list">${laborRows||'<div style="color:#7a8499;font-size:13px;padding:12px 0;text-align:center">No labor logged yet</div>'}</div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="field" style="grid-column:1/-1"><label>Description *</label><input id="l-desc" placeholder="e.g. Replace brake pads & rotors"></div>
        <div class="field"><label>Hours *</label><input id="l-hrs" type="number" step="0.25" min="0.25" placeholder="1.5"></div>
        <div class="field"><label>Rate ($/hr)</label><input id="l-rate" type="number" step="1" value="${mechRate}"></div>
        <div class="field" style="grid-column:1/-1"><label>Sublet shop (optional)</label><select id="l-vendor" style="width:100%;background:#111318;border:1px solid #2a2f3f;color:#e2e4ea;padding:9px 10px;border-radius:8px;font-size:13px">${subletVendorOptions}</select></div>
      </div>
      <button class="btn-red" style="padding:10px 18px;border-radius:8px;font-size:13px;margin-top:8px" onclick="addLaborLine()">+ Add labor</button>`;
    wrapper.appendChild(laborPanel);

    // ── LEGACY REPAIRS (backward compat) ──
    if((v.repairs||[]).length){
      const legPanel=document.createElement('div');legPanel.className='panel';
      const legTotal=(v.repairs||[]).reduce((a,r)=>a+Number(r.cost||0),0);
      let legHtml=`<div class="panel-title">Previous repairs <span style="float:right;color:#C8102E">${fmt$(legTotal)}</span></div>`;
      (v.repairs||[]).forEach((r,i)=>{
        legHtml+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e2230">
          <span style="font-size:11px;color:#9aa3b8;background:#1e2230;padding:2px 7px;border-radius:5px;white-space:nowrap">${r.category}</span>
          <span style="flex:1;font-size:13px;color:#e2e4ea">${r.description}</span>
          <span style="font-size:13px;font-weight:600;color:#C8102E;white-space:nowrap">${fmt$(r.cost)}</span>
          <button class="del-btn" onclick="delRepair('${r.id}')">✕</button>
        </div>`;
      });
      legPanel.innerHTML=legHtml;
      wrapper.appendChild(legPanel);
    }

    // ── GRAND TOTAL ──
    const legacyTotal=(v.repairs||[]).reduce((a,r)=>a+Number(r.cost||0),0);
    const grandTotal=partsTotal+laborTotal+legacyTotal;
    const totDiv=document.createElement('div');
    totDiv.style.cssText='background:#111318;border:1px solid #2a2f3f;border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center';
    totDiv.innerHTML=`<span style="font-size:13px;color:#cdd3de;font-weight:600;letter-spacing:.5px">TOTAL RECON COST</span><span style="font-size:24px;font-weight:700;color:#C8102E">${fmt$(grandTotal)}</span>`;
    wrapper.appendChild(totDiv);

    el.appendChild(wrapper);

    // ── PARTS HANDLERS ──
    window.addPart=function(){
      const name=document.getElementById('p-name').value.trim();
      const cost=parseFloat(document.getElementById('p-cost').value)||0;
      if(!name||!cost){toast('Part name and cost required','err');return;}
      const vendor=document.getElementById('p-vendor')?.value||'';
      const state=document.getElementById('p-state')?.value||'received';
      const newPart={
        name,
        partNum:document.getElementById('p-num').value.trim(),
        cost,
        qty:parseInt(document.getElementById('p-qty').value)||1,
        vendor,
        state
      };
      // Stamp dates by state
      if(state === 'ordered') newPart.orderedDate = Date.now();
      if(state === 'received') newPart.receivedDate = Date.now();
      if(state === 'installed'){ newPart.receivedDate = Date.now(); newPart.installedDate = Date.now(); }
      v.parts=[...(v.parts||[]),newPart];
      writeToCurrentVisit(v,'parts',v.parts);
      // If this part puts the vehicle into "waiting on parts" or out of it, sync status
      syncPartsStatus(v);
      save();
      // If state was 'ordered', open the order dialog to fill ETA/tracking
      if(state === 'ordered'){
        const newIdx = v.parts.length - 1;
        setTimeout(()=>window.openOrderDialog(newIdx), 50);
      }
    };
    window.deletePart=function(i){
      v.parts=(v.parts||[]).filter((_,j)=>j!==i);
      writeToCurrentVisit(v,'parts',v.parts);
      syncPartsStatus(v);
      save();
    };

    // Mark a part as received (via the ✓ Received button on row)
    window.markPartReceived=function(i){
      const p = (v.parts||[])[i];
      if(!p) return;
      const updated = [...v.parts];
      updated[i] = {...p, state:'received', receivedDate:Date.now()};
      v.parts = updated;
      writeToCurrentVisit(v,'parts',v.parts);
      syncPartsStatus(v);
      save();
      toast(`✓ "${p.name}" marked as received`);
    };

    // Final stage: the part is on the car (or back to received)
    window.markPartInstalled=function(i,on){
      const p = (v.parts||[])[i];
      if(!p) return;
      const updated = [...v.parts];
      updated[i] = on ? {...p, state:'installed', installedDate:Date.now()} : {...p, state:'received', installedDate:null};
      v.parts = updated;
      writeToCurrentVisit(v,'parts',v.parts);
      syncPartsStatus(v);
      save();
      toast(on ? `🔧 "${p.name}" marked as installed` : `"${p.name}" back to received`);
    };

    // Open dialog to edit ETA/tracking/note (used when transitioning needed→ordered, or editing an order)
    window.openOrderDialog=function(i){
      const p = (v.parts||[])[i];
      if(!p) return;
      const overlay = document.createElement('div');
      overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9990;display:flex;align-items:center;justify-content:center;padding:18px';
      const etaVal = p.eta ? new Date(p.eta).toISOString().slice(0,10) : '';
      const trackingVal = (p.trackingNum||'').replace(/"/g,'&quot;');
      const noteVal = (p.note||'').replace(/"/g,'&quot;');
      const isOrdering = p.state !== 'ordered'; // transitioning vs. editing
      overlay.innerHTML = `
        <div style="max-width:440px;width:100%;background:#111318;border:1px solid #2a2f3f;border-radius:14px;overflow:hidden">
          <div style="padding:14px 18px;border-bottom:1px solid #1e2230;display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:14px;font-weight:700;color:#fff">${isOrdering ? '🚚 Mark as ordered' : '✎ Edit order details'}</div>
            <button id="po-close" style="background:transparent;border:1px solid #374151;color:#fff;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer">Close</button>
          </div>
          <div style="padding:16px">
            <div style="font-size:13px;color:#e2e4ea;margin-bottom:14px;padding:8px 12px;background:#0c0e13;border-radius:8px;border-left:3px solid #C8102E">
              <strong>${p.name}</strong>${p.partNum?` <span style="color:#9aa3b8">#${p.partNum}</span>`:''}
            </div>
            <div class="field"><label>Expected arrival (optional)</label><input id="po-eta" type="date" value="${etaVal}" style="width:100%;background:#0a0c10;border:1px solid #1e2230;border-radius:8px;padding:9px 10px;color:#e2e4ea;font-size:13px"></div>
            <div class="field"><label>Tracking # (optional)</label><input id="po-tracking" value="${trackingVal}" placeholder="e.g. 1Z999AA10123456784" style="width:100%;background:#0a0c10;border:1px solid #1e2230;border-radius:8px;padding:9px 10px;color:#e2e4ea;font-size:13px;font-family:ui-monospace,monospace"></div>
            <div class="field"><label>Note (optional)</label><input id="po-note" value="${noteVal}" placeholder="e.g. Backorder, drop-shipping from Atlanta" style="width:100%;background:#0a0c10;border:1px solid #1e2230;border-radius:8px;padding:9px 10px;color:#e2e4ea;font-size:13px"></div>
          </div>
          <div style="padding:12px 16px;border-top:1px solid #1e2230;display:flex;gap:8px;justify-content:flex-end">
            <button class="btn-red" id="po-save" style="padding:9px 18px;border-radius:8px;font-size:13px">${isOrdering ? '🚚 Mark as ordered' : 'Save changes'}</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const cleanup=()=>overlay.remove();
      overlay.querySelector('#po-close').onclick=cleanup;
      overlay.onclick=(e)=>{if(e.target===overlay) cleanup();};
      overlay.querySelector('#po-save').onclick=()=>{
        const etaInput = overlay.querySelector('#po-eta').value;
        const eta = etaInput ? new Date(etaInput+'T12:00:00').getTime() : null;
        const trackingNum = overlay.querySelector('#po-tracking').value.trim();
        const note = overlay.querySelector('#po-note').value.trim();
        const updated = [...v.parts];
        updated[i] = {
          ...p,
          state: 'ordered',
          orderedDate: p.orderedDate || Date.now(),
          eta: eta || null,
          trackingNum: trackingNum || '',
          note: note || ''
        };
        v.parts = updated;
        writeToCurrentVisit(v,'parts',v.parts);
        syncPartsStatus(v);
        save();
        cleanup();
        toast(isOrdering ? `🚚 "${p.name}" marked as ordered` : `Order details saved`);
      };
    };

    // Helper for tracking-link click — opens common carriers' search by tracking #
    window.openTrackingSearch = function(tnum){
      if(!tnum) return;
      // Open Google search with tracking number — works for UPS/FedEx/USPS/etc.
      const url = 'https://www.google.com/search?q=' + encodeURIComponent('track ' + tnum);
      window.open(url, '_blank', 'noopener');
    };

    // ── LABOR HANDLERS ──
    window.addLaborLine=function(){
      const desc=document.getElementById('l-desc').value.trim();
      const hours=parseFloat(document.getElementById('l-hrs').value)||0;
      const rate=parseFloat(document.getElementById('l-rate').value)||mechRate;
      if(!desc||!hours){toast('Description and hours required','err');return;}
      const vendor=document.getElementById('l-vendor')?.value||'';
      v.laborLines=[...(v.laborLines||[]),{desc,hours,rate,vendor}];
      save({laborLines:v.laborLines});
    };
    window.deleteLaborLine=function(i){v.laborLines=(v.laborLines||[]).filter((_,j)=>j!==i);save({laborLines:v.laborLines});};

    // ── RECEIPT SCANNER HANDLERS ──
    window.handleReceiptDrop=function(e){const f=e.dataTransfer?.files?.[0];if(f)window.processReceiptFileObj(f);};
    window.processReceiptFile=function(input){if(input.files[0])window.processReceiptFileObj(input.files[0]);input.value='';};
    window.processReceiptFileObj=async function(file){
      const st=document.getElementById('receipt-scan-status');
      const pv=document.getElementById('receipt-preview-items');
      if(!st||!pv)return;
      st.textContent='Reading receipt...';st.style.color='#f59e0b';pv.innerHTML='';
      try{
        const fileName = file.name || ('receipt.' + (file.type.includes('pdf') ? 'pdf' : 'jpg'));
        const isPdf = file.type === 'application/pdf' || fileName.toLowerCase().endsWith('.pdf');
        const isImage = !isPdf && (file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(fileName));
        if(!isPdf && !isImage){st.textContent='Unsupported file type — use JPG, PNG, HEIC, or PDF.';st.style.color='#f87171';return;}

        // Build data URL — PDFs go to AI as-is (worker handles them natively),
        // images get HEIC-converted (if needed) and compressed to <=1600px JPEG.
        let aiDataUrl;
        if(isPdf){
          st.textContent='Reading PDF...';
          aiDataUrl = await blobToDataUrl(file);
        } else {
          let workingFile = file;
          if(isHeicFile(file)){
            st.textContent='Converting iPhone photo...';
            workingFile = await heicToJpegBlob(file);
          }
          st.textContent='Processing image...';
          aiDataUrl = await compressImage(workingFile, 1600, 0.85);
        }

        st.textContent='Scanning with AI...';
        const result = await scanReceiptWithAI(aiDataUrl);
        const extrasTotal = result ? (result.tax||0)+(result.shipping||0) : 0;
        const items = result && result.items ? foldReceiptExtras(result.items, extrasTotal) : null;
        if(!items||!items.length){st.textContent='Could not read receipt — fill the frame with the receipt.';st.style.color='#f87171';return;}
        st.textContent=`Found ${items.length} item${items.length!==1?'s':''}${extrasTotal?` · tax/shipping $${extrasTotal.toFixed(2)} added to cost`:''}. Review and confirm:`;
        st.style.color='#34d399';
        let h=`<div style="background:#111318;border:1px solid #2a2f3f;border-radius:10px;overflow:hidden;margin-top:6px">`;
        // Bulk-state header
        h+=`<div style="padding:8px 12px;border-bottom:1px solid #1e2230;background:#0c0e13;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:10px;color:#9aa3b8;letter-spacing:.5px;text-transform:uppercase;font-weight:700">Mark all as</span>
          <button id="ri-bulk-recv" type="button" style="font-size:10px;font-weight:700;padding:4px 9px;border-radius:5px;border:1px solid #14532d;background:#14532d33;color:#bbf7d0;cursor:pointer;letter-spacing:.4px;font-family:inherit">✓ RECEIVED</button>
          <button id="ri-bulk-ord" type="button" style="font-size:10px;font-weight:700;padding:4px 9px;border-radius:5px;border:1px solid #1e3a8a;background:#1e3a8a33;color:#bfdbfe;cursor:pointer;letter-spacing:.4px;font-family:inherit">🚚 ORDERED</button>
        </div>`;
        items.forEach((item,i)=>{
          // New shape has eachCost+quantity, legacy has cost only
          const displayCost = item.eachCost != null ? (item.eachCost * (item.quantity||1)) : (item.cost||0);
          h+=`<div style="padding:10px 14px;border-bottom:1px solid #1e2230">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <input type="checkbox" id="ri-${i}" checked style="accent-color:#C8102E;width:16px;height:16px;flex-shrink:0">
              <span style="flex:1;font-size:13px;color:#e2e4ea;min-width:0">${item.description}</span>
              <span style="font-size:13px;font-weight:600;color:#C8102E;white-space:nowrap">${fmt$(displayCost)}</span>
            </div>
            <div style="display:inline-flex;border:1px solid #1e2230;border-radius:6px;overflow:hidden;margin-left:26px">
              <button type="button" data-rs-state="${i}" data-rs-state-val="received"
                style="font-size:9px;font-weight:700;padding:4px 9px;border:none;cursor:pointer;letter-spacing:.4px;background:#14532d;color:#bbf7d0;font-family:inherit">✓ RECEIVED</button>
              <button type="button" data-rs-state="${i}" data-rs-state-val="ordered"
                style="font-size:9px;font-weight:700;padding:4px 9px;border:none;border-left:1px solid #1e2230;cursor:pointer;letter-spacing:.4px;background:transparent;color:#9aa3b8;font-family:inherit">🚚 ORDERED</button>
            </div>
          </div>`;
        });
        h+=`</div><button class="btn-red" style="margin-top:10px;width:100%;padding:11px;border-radius:8px;font-size:13px;font-weight:600" onclick="window.confirmReceiptItems(${JSON.stringify(items).replace(/"/g,'&quot;')})">Add checked items to parts</button>`;
        pv.innerHTML=h;
        // Wire per-row state buttons (visual + tracking on data attribute on the row)
        const setRowState=(i, val)=>{
          const buttons = pv.querySelectorAll(`[data-rs-state="${i}"]`);
          buttons.forEach(b=>{
            const isActive = b.dataset.rsStateVal === val;
            if(b.dataset.rsStateVal === 'received'){
              b.style.background = isActive ? '#14532d' : 'transparent';
              b.style.color = isActive ? '#bbf7d0' : '#555d73';
            } else {
              b.style.background = isActive ? '#1e3a8a' : 'transparent';
              b.style.color = isActive ? '#bfdbfe' : '#555d73';
            }
            // Stash state on the checkbox for read at confirm time
            const cb = document.getElementById(`ri-${i}`);
            if(cb) cb.dataset.state = val;
          });
        };
        // Initialize all to received
        items.forEach((_,i)=>setRowState(i,'received'));
        pv.querySelectorAll('[data-rs-state]').forEach(btn=>{
          btn.onclick = ()=>setRowState(parseInt(btn.dataset.rsState), btn.dataset.rsStateVal);
        });
        // Bulk-action buttons
        pv.querySelector('#ri-bulk-recv').onclick = ()=>{
          items.forEach((_,i)=>setRowState(i,'received'));
        };
        pv.querySelector('#ri-bulk-ord').onclick = ()=>{
          items.forEach((_,i)=>setRowState(i,'ordered'));
        };
      }catch(e){st.textContent='Error: '+e.message;st.style.color='#f87171';console.error(e);}
    };
    window.confirmReceiptItems=function(itemsJson){
      const items=typeof itemsJson==='string'?JSON.parse(itemsJson.replace(/&quot;/g,'"')):itemsJson;
      // Convert checked items into the same shape openReceiptIntent expects
      const picked = [];
      items.forEach((item,i)=>{
        const cb=document.getElementById(`ri-${i}`);
        if(cb&&cb.checked){
          const qty = item.quantity || 1;
          const each = item.eachCost != null ? item.eachCost : (item.cost || 0);
          // Read per-row state from the checkbox's data-state (default received)
          const rowState = (cb.dataset.state === 'ordered') ? 'ordered' : 'received';
          picked.push({
            description: item.description || '',
            partNumber: item.partNumber || '',
            eachCost: parseFloat(each) || 0,
            quantity: parseInt(qty) || 1,
            state: rowState
          });
        }
      });
      // Clear the inline preview right away
      const st=document.getElementById('receipt-scan-status');const pv=document.getElementById('receipt-preview-items');
      if(st)st.textContent='';if(pv)pv.innerHTML='';
      if(picked.length === 0){ return; }
      // Look up the live vehicle from ST so we have the freshest copy
      const freshV = ST.vehicles.find(x=>x.id===v.id) || v;
      // If this vehicle has ordered parts pending, route through match dialog
      const orderedPending = (freshV.parts||[]).filter(p=>(p.state||'received')==='ordered');
      if(orderedPending.length > 0){
        openReceiptIntent(freshV, picked, orderedPending, ()=>{
          // After dialog closes, refresh detail tab
          if(typeof refreshDetail === 'function') refreshDetail();
        });
      } else {
        // No pending orders — add directly as received parts
        finalizeReceiptParts(freshV, picked, []);
        if(typeof refreshDetail === 'function') refreshDetail();
      }
    };
  }



  function buildHistoryTab(el){
    const ownVisits = (v.visits || []).map(visit=>({visit, vehicle:v, isOwn:true}));

    // Pull visits from OTHER records with the same VIN (read-only cross-record history)
    const sameVinOthers = [];
    if(v.vin){
      const vinKey = v.vin.trim().toUpperCase();
      ST.vehicles.forEach(other=>{
        if(other.id === v.id) return;
        if(!other.vin) return;
        if(other.vin.trim().toUpperCase() !== vinKey) return;
        (other.visits||[]).forEach(visit=>{
          sameVinOthers.push({visit, vehicle:other, isOwn:false});
        });
      });
    }

    const allEntries = [...ownVisits, ...sameVinOthers];
    if(!allEntries.length){
      el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-msg">No service history</div></div>';
      return;
    }

    const curVisitId = currentVisit(v)?.id;
    // Sort all entries by dateIn descending (newest first)
    allEntries.sort((a,b)=>(b.visit.dateIn||0)-(a.visit.dateIn||0));

    const ownCount = ownVisits.length;
    const otherCount = sameVinOthers.length;
    let headerText = ownCount + ' service visit' + (ownCount!==1?'s':'') + ' for this record';
    if(otherCount > 0){
      headerText += ' · ' + otherCount + ' more on this VIN (other records)';
    }
    let html = '<div style="font-size:11px;color:var(--text3);margin-bottom:12px;letter-spacing:.5px;text-transform:uppercase;font-weight:600">'+headerText+'</div>';

    // For visit numbering: count visits per record separately
    const ownVisitsByOldest = [...(v.visits||[])].sort((a,b)=>(a.dateIn||0)-(b.dateIn||0));

    allEntries.forEach((entry, idx)=>{
      const {visit, vehicle, isOwn} = entry;
      const isCurrent = isOwn && visit.id === curVisitId;
      const visitNum = isOwn
        ? (ownVisitsByOldest.findIndex(x=>x.id===visit.id) + 1)
        : ((vehicle.visits||[]).findIndex(x=>x.id===visit.id) + 1);
      const statusLabels = (visit.statuses||[]).map(sid=>SMAP[sid]).filter(Boolean);
      const partsCost = (visit.parts||[]).reduce((a,p)=>a+((parseFloat(p.cost)||0)*(parseInt(p.qty)||1)),0);
      const laborCost = (visit.laborLines||[]).reduce((a,l)=>a+((parseFloat(l.hours)||0)*(parseFloat(l.rate)||0)),0);
      const legacyCost = (visit.repairs||[]).reduce((a,r)=>a+Number(r.cost||0),0);
      const total = partsCost + laborCost + legacyCost;
      const mech = visit.assignedTo ? getMMAP()[visit.assignedTo] : null;
      const dateIn = visit.dateIn ? new Date(visit.dateIn).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}) : '—';
      const dateOut = visit.dateOut ? new Date(visit.dateOut).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}) : null;
      const isBooked = (visit.statuses||[]).includes('booked');

      // Styling: read-only entries get dimmed appearance + clickable to jump to that record
      const borderLeft = isCurrent ? '#C8102E' : (!isOwn ? '#8896a8' : (isBooked ? '#818cf8' : 'var(--border2)'));
      const border = isCurrent ? '#C8102E' : (!isOwn ? 'var(--border)' : 'var(--border)');
      const bg = !isOwn ? '#0a0c11' : 'var(--surface)';
      const opacity = !isOwn ? '0.78' : '1';
      const cursor = !isOwn ? 'pointer' : 'default';
      const clickHandler = !isOwn
        ? ' onclick="ST.selectedId=\''+vehicle.id+'\';ST.view=\'detail\';ST.activeTab=\'history\';render();"'
        : '';

      html += '<div style="background:'+bg+';border:1px solid '+border+';border-left:3px solid '+borderLeft+';border-radius:var(--r-lg);padding:14px 15px;margin-bottom:10px;opacity:'+opacity+';cursor:'+cursor+'"'+clickHandler+'>';

      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">';
      html += '<div style="min-width:0;flex:1"><div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:3px">';
      html += (isOwn ? '✏️ Visit #'+visitNum : '📖 Visit #'+visitNum);
      if(isCurrent){
        html += '<span style="font-size:10px;background:#C8102E22;color:#C8102E;padding:2px 7px;border-radius:var(--r);letter-spacing:.5px;margin-left:6px;font-weight:700;text-transform:uppercase">Current</span>';
      } else if(!isOwn){
        html += '<span style="font-size:10px;background:#1a2035;color:#b8c3d3;padding:2px 7px;border-radius:var(--r);letter-spacing:.5px;margin-left:6px;font-weight:700;text-transform:uppercase">Read-only</span>';
      }
      html += '</div>';

      if(!isOwn){
        html += '<div style="font-size:11px;color:#60a5fa;margin-bottom:3px;font-weight:600">Other record: Stock #'+(vehicle.stockNumber||'—')+' · tap to open →</div>';
      }

      html += '<div style="font-size:11px;color:var(--text3);letter-spacing:.3px">In: <strong style="color:var(--text2)">'+dateIn+'</strong>';
      if(dateOut) html += ' · Out: <strong style="color:var(--text2)">'+dateOut+'</strong>';
      html += '</div></div>';
      html += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">';
      html += '<div style="font-size:15px;font-weight:800;color:#C8102E;text-align:right;font-variant-numeric:tabular-nums">'+fmt$(total)+'</div>';
      // Per-visit delete button — OWN visits only, when unlocked, and only if >1 visit exists on this record
      if(isOwn && ST.masterPinUnlocked && ownVisits.length > 1){
        html += '<button onclick="event.stopPropagation();deleteVisitById(\''+visit.id+'\')" title="Delete this visit" style="background:#1a0d0d;border:1px solid #f8717155;color:#fca5a5;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer">🗑 Delete</button>';
      }
      html += '</div>';
      html += '</div>';

      html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:11px;color:var(--text3);margin-bottom:8px">';
      html += '<div><span style="color:var(--text4);text-transform:uppercase;font-weight:600;letter-spacing:.5px">Stock #</span> <span style="color:var(--text2);font-weight:600">'+(visit.stockNumber||'—')+'</span></div>';
      html += '<div><span style="color:var(--text4);text-transform:uppercase;font-weight:600;letter-spacing:.5px">Mechanic</span> <span style="color:'+(mech?mech.color:'var(--text3)')+';font-weight:600">'+(mech?mech.icon+' '+mech.name:'— Unassigned')+'</span></div>';
      html += '<div><span style="color:var(--text4);text-transform:uppercase;font-weight:600;letter-spacing:.5px">Parts</span> <span style="color:var(--text2);font-weight:600">'+(visit.parts||[]).length+'</span></div>';
      html += '<div><span style="color:var(--text4);text-transform:uppercase;font-weight:600;letter-spacing:.5px">Labor</span> <span style="color:var(--text2);font-weight:600">'+(visit.laborLines||[]).length+' line'+((visit.laborLines||[]).length!==1?'s':'')+'</span></div>';
      html += '</div>';

      if(statusLabels.length){
        html += '<div style="display:flex;flex-wrap:wrap;gap:3px">';
        html += statusLabels.map(s=>'<span class="v-tag" style="background:'+s.color+'22;color:'+s.color+';border:1px solid '+s.color+'55">'+s.icon+' '+s.label+'</span>').join('');
        html += '</div>';
      }
      html += '</div>';
    });
    el.innerHTML = html;
  }

  function buildTimeClockTab(el){
    const sessions=v.timeSessions||[];
    const isManager=ST.role==='manager';
    // Find ALL active sessions on this vehicle (any mechanic)
    const activeSessions=sessions.filter(s=>!s.end);
    // Active session for current role (mechanic clocked in themselves)
    const myActiveSess=!isManager?sessions.find(s=>s.mechId===ST.role&&!s.end):null;

    // Compute total hours per mechanic
    const mechTotals={};
    sessions.filter(s=>s.end).forEach(s=>{
      const hrs=(s.end-s.start)/3600000;
      mechTotals[s.mechId]=(mechTotals[s.mechId]||0)+hrs;
    });
    const totalHours=Object.values(mechTotals).reduce((a,b)=>a+b,0);

    const wrapper=document.createElement('div');

    // ── ACTIVE SESSIONS BANNER ──
    if(activeSessions.length){
      activeSessions.forEach(sess=>{
        const clockedMech=sess.mechId?getMMAP()[sess.mechId]:null;
        const elapsed=Date.now()-sess.start;
        const hh=Math.floor(elapsed/3600000).toString().padStart(2,'0');
        const mm=Math.floor((elapsed%3600000)/60000).toString().padStart(2,'0');
        const ss2=Math.floor((elapsed%60000)/1000).toString().padStart(2,'0');
        const banner=document.createElement('div');
        banner.style.cssText='background:#0d2a0d;border:1px solid #166534;border-radius:12px;padding:18px 16px;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:8px';
        const timerId='tc-timer-'+sess.id;
        banner.innerHTML=`<div style="font-size:11px;color:#4ade80;letter-spacing:1.5px;font-weight:600">● CLOCKED IN — ${(clockedMech?.name||sess.mechId||'?').toUpperCase()}</div>
          <div id="${timerId}" style="font-size:38px;font-weight:700;color:#fff;font-family:monospace;letter-spacing:2px">${hh}:${mm}:${ss2}</div>
          <div style="font-size:12px;color:#cdd3de">Started ${new Date(sess.start).toLocaleTimeString()}</div>
          ${(isManager||sess.mechId===ST.role)?`<button class="btn-red" style="margin-top:4px;padding:11px 32px;border-radius:9px;font-size:14px;font-weight:700;width:100%;max-width:240px" onclick="clockOutSession('${sess.id}')">⏹ Clock out</button>`:''}`;
        wrapper.appendChild(banner);
        const iv=setInterval(()=>{
          const el2=document.getElementById(timerId);
          if(!el2){clearInterval(iv);return;}
          const e2=Date.now()-sess.start;
          el2.textContent=[Math.floor(e2/3600000),Math.floor((e2%3600000)/60000),Math.floor((e2%60000)/1000)].map(n=>n.toString().padStart(2,'0')).join(':');
        },1000);
      });
    }

    // ── CLOCK IN/OUT SECTION ──
    const activeMechIds=new Set(activeSessions.map(s=>s.mechId));

    if(isManager){
      // Manager: buttons for all mechanics
      const availMechs=getMechs().filter(m=>!activeMechIds.has(m.id));
      if(availMechs.length){
        const mp=document.createElement('div');
        mp.style.cssText='margin-bottom:14px';
        mp.innerHTML=`<div style="font-size:11px;color:#9aa3b8;letter-spacing:.8px;font-weight:600;margin-bottom:8px">CLOCK IN A MECHANIC</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${availMechs.map(m=>`<button style="background:#111318;border:1.5px solid #2a2f3f;border-radius:10px;padding:12px 14px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:70px;transition:border-color .15s" onmouseover="this.style.borderColor='${m.color}'" onmouseout="this.style.borderColor='#2a2f3f'" onclick="clockInAs('${m.id}')"><span style="font-size:22px">${m.icon}</span><span style="font-size:11px">${m.name}</span><span style="font-size:10px;color:#9aa3b8">$${m.laborRate||65}/hr</span></button>`).join('')}
          </div>`;
        wrapper.appendChild(mp);
      }
    } else {

        pickBtn.addEventListener('click',()=>{
          openCalendar(pickBtn.dataset.val||'', function(iso){
            save({apptDate:iso});
            toast('Appointment saved');
            refreshDetail();
          });

      }
      const clearBtn=document.getElementById('appt-clear-btn');
      if(clearBtn){
        clearBtn.addEventListener('click',()=>{
          save({apptDate:''});
          toast('Appointment cleared');
          refreshDetail();
        });
      }
    }
  }

  function buildReceiptsTab(el){
    // Single hidden file input — accepts images and PDFs; no camera capture attribute
    // so the native picker lets user choose camera OR library (iOS + Android default)
    const fileInput=document.createElement('input');
    fileInput.type='file';
    fileInput.accept='image/*,application/pdf';
    fileInput.multiple=false; // one at a time, because extraction modal blocks UI per-file
    fileInput.style.display='none';
    fileInput.onchange=e=>{
      const f = e.target.files && e.target.files[0];
      if(f) handleReceiptFile(f);
      fileInput.value=''; // allow re-picking same file
    };
    el.appendChild(fileInput);

    // MAIN FLOW: upload to Storage → show modal → AI extract → confirm parts → done
    async function handleReceiptFile(file){
      const fileName = file.name || ('receipt.' + (file.type.includes('pdf') ? 'pdf' : 'jpg'));
      const isPdf = file.type === 'application/pdf' || fileName.toLowerCase().endsWith('.pdf');
      const isImage = !isPdf && (file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(fileName));

      if(!isPdf && !isImage){
        toast('Unsupported file type — use JPG, PNG, HEIC, or PDF','err');
        return;
      }

      toast('Uploading receipt…');
      try {
        // 1) Get the bytes we'll save (handle HEIC conversion + image compression)
        let uploadBlob;
        let uploadMime;
        let uploadExt;
        let aiDataUrl; // data URL we'll send to AI extraction

        if(isPdf){
          uploadBlob = file;
          uploadMime = 'application/pdf';
          uploadExt = 'pdf';
          aiDataUrl = await blobToDataUrl(file);
        } else {
          // Image path: convert HEIC if needed, then compress to <1600px JPEG
          let workingFile = file;
          if(isHeicFile(file)){
            toast('Converting iPhone photo…');
            try {
              workingFile = await heicToJpegBlob(file);
            } catch(e){
              throw new Error('HEIC conversion failed: ' + e.message);
            }
          }
          // Compress (also gives us a data URL for AI)
          aiDataUrl = await compressImage(workingFile, 1600, 0.85);
          uploadBlob = dataUrlToBlob(aiDataUrl);
          uploadMime = 'image/jpeg';
          uploadExt = 'jpg';
        }

        // 2) Upload to Firebase Storage (direct, no Firestore bloat)
        let receiptEntry;
        if(storage){
          try {
            const path = `shops/automotive_connection/vehicles/${v.id}/receipts/${uid()}.${uploadExt}`;
            const obj = await uploadToStorage(uploadBlob, path);
            receiptEntry = {...obj, name:fileName, date:Date.now()};
          } catch(upErr){
            console.warn('Storage upload failed, using inline:', upErr);
            receiptEntry = {name:fileName, data:aiDataUrl, date:Date.now()};
          }
        } else {
          receiptEntry = {name:fileName, data:aiDataUrl, date:Date.now()};
        }

        addReceipt(receiptEntry);
        toast('Receipt saved ✓');

        // 3) Kick off AI extraction — pop modal over current view
        openExtractionModal(v, fileName, aiDataUrl, isPdf);
      } catch(e){
        console.error('Receipt upload error:',e);
        toast('Upload failed: '+e.message,'err');
      }
    }

    // Add-receipt button (single CTA)
    const zone=document.createElement('div');zone.className='cam-zone';
    zone.innerHTML=`<div class="cam-icon" style="background:#1a1600"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="2" width="16" height="18" rx="2.5" stroke="#f59e0b" stroke-width="1.5" fill="none"/><line x1="6" y1="7" x2="16" y2="7" stroke="#f59e0b" stroke-width="1.2"/><line x1="6" y1="11" x2="16" y2="11" stroke="#f59e0b" stroke-width="1.2"/><line x1="6" y1="15" x2="11" y2="15" stroke="#f59e0b" stroke-width="1.2"/></svg></div>
      <div class="cam-title" style="color:#fbbf24">+ Add receipt</div><div class="cam-sub">Photo, PDF, or image · AI reads parts automatically</div>`;
    zone.onclick=()=>fileInput.click();
    el.appendChild(zone);

    // List existing receipts
    (v.receipts||[]).forEach((r,i)=>{
      const row=document.createElement('div');row.className='receipt-row';
      const rName=receiptName(r);const rUrl=receiptUrl(r);const rDate=receiptDate(r);const isPdf=receiptIsPdf(r);
      row.innerHTML=`${fileThumbHtml(r,{icon:'🧾'})}
        <div class="receipt-info"><div class="receipt-name">${rName}</div><div class="receipt-date">${fmtD(rDate)}</div></div>
        <a class="dl-link" href="${rUrl}" download="${rName}" target="_blank" rel="noopener">⬇ Download</a>`;
      if(ST.masterPinUnlocked){
        const del=document.createElement('button');del.className='del-btn';del.textContent='✕';
        del.onclick=()=>{if(confirm(`Delete "${rName}"?`)) delReceipt(i);};
        row.appendChild(del);
      }
      el.appendChild(row);
    });
  }

  // ═══════════════════════════════════════════════
  // RECEIPT EXTRACTION MODAL — AI reads parts, user edits before save
  // ═══════════════════════════════════════════════
  function openExtractionModal(vehicle, fileName, dataUrl, isPdf){
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.90);z-index:9990;display:flex;align-items:center;justify-content:center;padding:18px';
    overlay.innerHTML=`
      <div style="max-width:560px;width:100%;max-height:calc(100vh - 36px);background:#111318;border:1px solid #1e2230;border-radius:14px;display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:16px 18px;border-bottom:1px solid #1e2230;display:flex;align-items:center;gap:14px;flex-shrink:0">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🧾 ${fileName}</div>
            <div id="ex-status" style="font-size:11px;color:#fbbf24;margin-top:3px">⏳ AI reading receipt…</div>
          </div>
          <button id="ex-close" style="background:transparent;border:1px solid #374151;color:#fff;font-size:13px;padding:7px 13px;border-radius:7px;cursor:pointer;flex-shrink:0">Close</button>
        </div>
        <div id="ex-body" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden"></div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup=()=>overlay.remove();
    overlay.querySelector('#ex-close').onclick=cleanup;
    overlay.onclick=(e)=>{if(e.target===overlay) cleanup();};

    const setStatus=t=>{const s=overlay.querySelector('#ex-status'); if(s){s.textContent=t; s.style.color='#fbbf24';}};
    const setStatusOk=t=>{const s=overlay.querySelector('#ex-status'); if(s){s.textContent=t; s.style.color='#6ee7b7';}};
    const setStatusErr=t=>{const s=overlay.querySelector('#ex-status'); if(s){s.textContent=t; s.style.color='#f87171';}};

    // Initial loading placeholder
    overlay.querySelector('#ex-body').innerHTML=`
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;color:#9aa3b8;font-size:13px;text-align:center">
        ⏳ Reading receipt with AI…
      </div>`;

    scanReceiptWithAI(dataUrl).then(result=>{
      const body=overlay.querySelector('#ex-body');
      if(!body) return;

      if(!result){
        setStatusErr('AI extraction failed');
        body.innerHTML=`
          <div style="flex:1;padding:20px;text-align:center;color:#b8c3d3;font-size:13px;line-height:1.6;display:flex;align-items:center;justify-content:center">
            Could not reach the AI. The receipt file is saved, but you'll need to add parts manually.
          </div>
          <div style="flex-shrink:0;padding:14px 16px;border-top:1px solid #1e2230;background:#0d0f14">
            <button id="ex-done" style="width:100%;background:#1e2230;border:1px solid #374151;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:9px;cursor:pointer">Done</button>
          </div>`;
        overlay.querySelector('#ex-done').onclick=cleanup;
        return;
      }

      const items = result.items || [];
      const taxTotal = (result.tax || 0) + (result.shipping || 0); // tax + shipping both go into the parts' cost

      if(items.length===0){
        setStatusOk('No parts detected');
      } else {
        setStatusOk(`Found ${items.length} part${items.length!==1?'s':''}${taxTotal?` · tax${result.shipping?' + shipping':''} $${taxTotal.toFixed(2)} added to cost`:''}`);
      }

      // Local working copy; user edits update this before save.
      // Distribute tax proportionally across items by subtotal weight.
      const subtotal = items.reduce((a,it)=>a + (Number(it.eachCost)||0) * (Number(it.quantity)||1), 0);
      const working = items.map((it, idx)=>{
        const each = Number(it.eachCost)||0;
        const qty = Number(it.quantity)||1;
        const lineTotal = each * qty;
        // Per-item tax share proportional to line total
        const taxShare = (subtotal > 0 && taxTotal > 0) ? (lineTotal / subtotal) * taxTotal : 0;
        // Each-cost after tax share (split evenly across qty)
        const eachWithTax = qty > 0 ? (lineTotal + taxShare) / qty : each;
        return {
          description: it.description || '',
          partNumber: it.partNumber || '',
          eachCost: eachWithTax, // includes proportional tax
          quantity: qty,
          pick: true,
          state: 'received', // 'received' | 'ordered' — per-item choice
          _id: 'ex-row-'+idx
        };
      });

      // Update bulk-state header summary
      const updateBulkHdr = ()=>{
        const hdr = overlay.querySelector('#ex-bulk-summary');
        if(!hdr) return;
        const picked = working.filter(r=>r.pick);
        const recv = picked.filter(r=>r.state==='received').length;
        const ord = picked.filter(r=>r.state==='ordered').length;
        const parts = [];
        if(recv) parts.push(`<span style="color:#bbf7d0">${recv} received</span>`);
        if(ord) parts.push(`<span style="color:#bfdbfe">${ord} ordered</span>`);
        hdr.innerHTML = parts.join(' <span style="color:#7a8499">·</span> ') || '<span style="color:#9aa3b8">No items selected</span>';
      };

      const renderRows = ()=>{
        const rowsDiv = overlay.querySelector('#ex-rows');
        if(!rowsDiv) return;
        rowsDiv.innerHTML = working.map((row,i)=>{
          const lineTotal = (Number(row.eachCost)||0) * (Number(row.quantity)||1);
          const isReceived = row.state === 'received';
          const isOrdered = row.state === 'ordered';
          // State toggle: two-button segmented control
          const stateToggle = `
            <div style="display:inline-flex;border:1px solid #1e2230;border-radius:7px;overflow:hidden;font-family:inherit">
              <button data-ex-state="${i}" data-ex-state-val="received" type="button"
                style="font-size:10px;font-weight:700;padding:5px 10px;border:none;cursor:pointer;letter-spacing:.4px;background:${isReceived?'#14532d':'transparent'};color:${isReceived?'#bbf7d0':'#555d73'};font-family:inherit">✓ RECEIVED</button>
              <button data-ex-state="${i}" data-ex-state-val="ordered" type="button"
                style="font-size:10px;font-weight:700;padding:5px 10px;border:none;border-left:1px solid #1e2230;cursor:pointer;letter-spacing:.4px;background:${isOrdered?'#1e3a8a':'transparent'};color:${isOrdered?'#bfdbfe':'#555d73'};font-family:inherit">🚚 ORDERED</button>
            </div>`;
          return `
          <div style="padding:11px;background:#0d0f14;border:1px solid ${row.pick?'#2a2f3f':'#1e2230'};border-radius:9px;margin-bottom:8px;opacity:${row.pick?'1':'0.5'}">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <input type="checkbox" data-ex-pick="${i}" ${row.pick?'checked':''} style="width:16px;height:16px;accent-color:#f59e0b;flex-shrink:0">
              <input type="text" data-ex-desc="${i}" value="${(row.description||'').replace(/"/g,'&quot;')}" placeholder="Description"
                style="flex:1;min-width:0;background:#0a0c10;border:1px solid #1e2230;border-radius:6px;padding:7px 9px;color:#e2e4ea;font-size:13px">
            </div>
            <div style="display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center;padding-left:26px;margin-bottom:8px">
              <span style="font-size:10px;color:#9aa3b8;text-transform:uppercase;letter-spacing:.5px">Part #</span>
              <input type="text" data-ex-partnum="${i}" value="${(row.partNumber||'').replace(/"/g,'&quot;')}" placeholder="—"
                style="grid-column:2 / span 3;background:#0a0c10;border:1px solid #1e2230;border-radius:6px;padding:6px 9px;color:#cdd3de;font-size:12px;font-family:ui-monospace,monospace">
              <span style="font-size:10px;color:#9aa3b8;text-transform:uppercase;letter-spacing:.5px">Each</span>
              <input type="number" step="0.01" min="0" data-ex-cost="${i}" value="${Number(row.eachCost||0).toFixed(2)}"
                style="background:#0a0c10;border:1px solid #1e2230;border-radius:6px;padding:6px 9px;color:#C8102E;font-size:13px;font-weight:600;text-align:right;font-family:ui-monospace,monospace">
              <span style="font-size:10px;color:#9aa3b8;text-transform:uppercase;letter-spacing:.5px;text-align:center">×&nbsp;qty</span>
              <input type="number" step="1" min="1" data-ex-qty="${i}" value="${row.quantity||1}"
                style="background:#0a0c10;border:1px solid #1e2230;border-radius:6px;padding:6px 9px;color:#e2e4ea;font-size:13px;text-align:center;font-family:ui-monospace,monospace">
              <span style="font-size:10px;color:#9aa3b8;text-transform:uppercase;letter-spacing:.5px;text-align:right">Line</span>
              <span data-ex-line="${i}" style="font-size:13px;font-weight:700;color:#fbbf24;text-align:right;padding:6px 9px;font-family:ui-monospace,monospace">$${lineTotal.toFixed(2)}</span>
            </div>
            <div style="padding-left:26px">
              ${stateToggle}
            </div>
          </div>`;
        }).join('');

        // Wire up live updates
        overlay.querySelectorAll('[data-ex-pick]').forEach(cb=>{
          cb.onchange = (e)=>{
            const i = +cb.dataset.exPick;
            working[i].pick = cb.checked;
            renderRows(); // re-render to update opacity + row bg
            updateTotal();
            updateBulkHdr();
          };
        });
        overlay.querySelectorAll('[data-ex-desc]').forEach(inp=>{
          inp.oninput = ()=>{ working[+inp.dataset.exDesc].description = inp.value; };
        });
        overlay.querySelectorAll('[data-ex-partnum]').forEach(inp=>{
          inp.oninput = ()=>{ working[+inp.dataset.exPartnum].partNumber = inp.value; };
        });
        overlay.querySelectorAll('[data-ex-cost]').forEach(inp=>{
          inp.oninput = ()=>{
            const i = +inp.dataset.exCost;
            working[i].eachCost = parseFloat(inp.value) || 0;
            const lineEl = overlay.querySelector(`[data-ex-line="${i}"]`);
            if(lineEl) lineEl.textContent = '$'+(working[i].eachCost * working[i].quantity).toFixed(2);
            updateTotal();
          };
        });
        overlay.querySelectorAll('[data-ex-qty]').forEach(inp=>{
          inp.oninput = ()=>{
            const i = +inp.dataset.exQty;
            const q = parseInt(inp.value) || 1;
            working[i].quantity = q > 0 ? q : 1;
            const lineEl = overlay.querySelector(`[data-ex-line="${i}"]`);
            if(lineEl) lineEl.textContent = '$'+(working[i].eachCost * working[i].quantity).toFixed(2);
            updateTotal();
          };
        });
        // State toggle (per row)
        overlay.querySelectorAll('[data-ex-state]').forEach(btn=>{
          btn.onclick = ()=>{
            const i = +btn.dataset.exState;
            working[i].state = btn.dataset.exStateVal;
            renderRows();
            updateBulkHdr();
          };
        });
      };

      const updateTotal = ()=>{
        const totalEl = overlay.querySelector('#ex-total');
        if(!totalEl) return;
        const total = working.filter(r=>r.pick).reduce((a,r)=>a + (Number(r.eachCost)||0) * (Number(r.quantity)||1), 0);
        const pickedCount = working.filter(r=>r.pick).length;
        totalEl.textContent = `${pickedCount} part${pickedCount!==1?'s':''} · $${total.toFixed(2)}`;
      };

      body.innerHTML = items.length ? `
        <div style="padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid #1e2230;background:#0c0e13">
          <div style="font-size:11px;color:#b8c3d3;letter-spacing:.4px;line-height:1.5;margin-bottom:8px">
            Each part's cost includes its share of tax. Set state per item below.
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="font-size:10px;color:#9aa3b8;letter-spacing:.5px;text-transform:uppercase;font-weight:700">Mark all as</span>
            <button id="ex-bulk-recv" style="font-size:10px;font-weight:700;padding:5px 11px;border-radius:6px;border:1px solid #14532d;background:#14532d33;color:#bbf7d0;cursor:pointer;letter-spacing:.4px;font-family:inherit">✓ RECEIVED</button>
            <button id="ex-bulk-ord" style="font-size:10px;font-weight:700;padding:5px 11px;border-radius:6px;border:1px solid #1e3a8a;background:#1e3a8a33;color:#bfdbfe;cursor:pointer;letter-spacing:.4px;font-family:inherit">🚚 ORDERED</button>
            <span id="ex-bulk-summary" style="margin-left:auto;font-size:11px;color:#cdd3de"></span>
          </div>
        </div>
        <div id="ex-rows" style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 0;-webkit-overflow-scrolling:touch"></div>
        <div style="flex-shrink:0;padding:10px 16px 14px;border-top:1px solid #1e2230;background:#0d0f14">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 4px 10px">
            <div style="font-size:11px;color:#9aa3b8;text-transform:uppercase;letter-spacing:.6px">Selected total</div>
            <div id="ex-total" style="font-size:15px;font-weight:700;color:#fbbf24;font-family:ui-monospace,monospace">—</div>
          </div>
          <button id="ex-add" style="width:100%;background:#f59e0b;border:none;color:#000;font-size:14px;font-weight:700;padding:13px;border-radius:9px;cursor:pointer">✓ Add selected parts</button>
        </div>
      ` : `
        <div style="padding:20px;text-align:center;color:#b8c3d3;font-size:13px;line-height:1.5;flex:1">
          No auto parts detected in this receipt.<br>
          <span style="color:#9aa3b8;font-size:11px">You can still confirm — the receipt file is saved.</span>
        </div>
        <div style="flex-shrink:0;padding:14px 16px;border-top:1px solid #1e2230;background:#0d0f14">
          <button id="ex-add" style="width:100%;background:#1e2230;border:1px solid #374151;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:9px;cursor:pointer">✓ Done</button>
        </div>
      `;

      if(items.length){
        renderRows();
        updateTotal();
        updateBulkHdr();
        // Wire bulk-action buttons
        overlay.querySelector('#ex-bulk-recv').onclick = ()=>{
          working.forEach(r=>{ if(r.pick) r.state = 'received'; });
          renderRows(); updateBulkHdr();
        };
        overlay.querySelector('#ex-bulk-ord').onclick = ()=>{
          working.forEach(r=>{ if(r.pick) r.state = 'ordered'; });
          renderRows(); updateBulkHdr();
        };
      }

      overlay.querySelector('#ex-add').onclick=()=>{
        const picked = working.filter(r=>r.pick);
        if(picked.length === 0){ cleanup(); return; }
        const freshV = ST.vehicles.find(x=>x.id===vehicle.id);
        if(!freshV){
          toast('Vehicle no longer exists','err');
          cleanup();
          return;
        }
        // Check if this vehicle has any 'ordered' parts pending — if so, ask user
        const orderedPending = (freshV.parts||[]).filter(p=>(p.state||'received')==='ordered');
        if(orderedPending.length > 0){
          openReceiptIntent(freshV, picked, orderedPending, cleanup);
        } else {
          // No pending orders → add with each item's chosen state
          finalizeReceiptParts(freshV, picked, []);
          cleanup();
        }
      };
    }).catch(e=>{
      console.error('Extraction error:',e);
      setStatusErr('Error: '+e.message);
      const body=overlay.querySelector('#ex-body');
      if(body){
        body.innerHTML=`
          <div style="flex:1;padding:20px;text-align:center;color:#b8c3d3;font-size:13px;line-height:1.6;display:flex;align-items:center;justify-content:center">
            <div>${e.message}<br><br>The receipt file is saved, but no parts were extracted.</div>
          </div>
          <div style="flex-shrink:0;padding:14px 16px;border-top:1px solid #1e2230;background:#0d0f14">
            <button id="ex-done2" style="width:100%;background:#1e2230;border:1px solid #374151;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:9px;cursor:pointer">Done</button>
          </div>`;
        overlay.querySelector('#ex-done2').onclick=cleanup;
      }
    });
  }



  function buildFrazerTab(el){
    const repairs=v.repairs||[];
    const total=repairs.reduce((a,r)=>a+Number(r.cost||0),0);
    const byCat={};repairs.forEach(r=>{if(!byCat[r.category])byCat[r.category]=0;byCat[r.category]+=Number(r.cost||0);});
    const statLabels=(v.statuses||[]).map(id=>SMAP[id]?.label||id).join(', ');
    const lines=[`STOCK#: ${v.stockNumber}`,`VIN: ${v.vin}`,`YEAR: ${v.year}`,`MAKE: ${v.make}`,`MODEL: ${v.model}`,`COLOR: ${v.color||''}`,`MILEAGE: ${v.mileage||''}`,`STATUS: ${statLabels}`,'','--- RECON COSTS ---',...Object.entries(byCat).map(([cat,cost])=>`${cat.toUpperCase()}: ${fmt$(cost)}`),``,`TOTAL RECON: ${fmt$(total)}`,'','--- REPAIRS ---',...repairs.map(r=>`${r.description} | ${fmt$(r.cost)}${r.mechanic?` | ${r.mechanic}`:''}`)].join('\n');

    const table=document.createElement('div');table.className='panel';
    table.innerHTML=`<div class="panel-title">Frazer system data</div><div style="border:1px solid #1e2230;border-radius:9px;overflow:hidden;margin-bottom:14px">
      ${[['Stock #',v.stockNumber],['VIN',v.vin],['Year',v.year],['Make',v.make],['Model',v.model],['Color',v.color],['Mileage',v.mileage],['Status',statLabels],['Total recon',fmt$(total)]].map(([k,val])=>`
      <div class="frazer-row"><div class="frazer-key">${k}</div><div class="frazer-val">${val||'—'}</div>
      <button class="copy-btn" onclick="navigator.clipboard.writeText('${(val||'').replace(/'/g,"\\'")}');toast('Copied')">copy</button></div>`).join('')}
    </div>`;
    el.appendChild(table);

    const pre=document.createElement('pre');pre.className='export-pre';pre.textContent=lines;el.appendChild(pre);
    const copyBtn=document.createElement('button');
    copyBtn.className='btn-red';copyBtn.style.cssText='padding:10px 20px;border-radius:8px;font-size:13px;margin-bottom:20px';
    copyBtn.textContent='📋 Copy all to clipboard';
    copyBtn.onclick=()=>navigator.clipboard.writeText(lines).then(()=>toast('Copied!'));
    el.appendChild(copyBtn);
  }

  renderTabContent(c.querySelector('#tab-content'));
}
